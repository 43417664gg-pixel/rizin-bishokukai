<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>予想カード｜RIZIN美食会予想</title>
<meta name="theme-color" content="#08080b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261019224115">
<style>
/* SNSで一枚歩きする「予想カード」。2026-10-19 作り直し：
   スマホで1スクショ＝そのままXに貼れる、を唯一の目的にする。
   ・サイトのナビは出さない（カードがページの一番上から始まる）
   ・勝者だけでなく「誰と誰の試合か」を必ず出す（勝者名だけでは第三者に読めない）
   ・出典（チャンネル名・投稿日・動画URL）とサイトURLをカード内に焼き込む */
body { padding-bottom: 24px; }
.pk-wrap { max-width: 440px; margin: 0 auto; padding: 10px 10px 0; }
.pk-card { position:relative; background:
    radial-gradient(130% 60% at 100% 0%, rgba(230,0,18,.20), transparent 55%),
    radial-gradient(90% 50% at 0% 100%, rgba(212,175,55,.08), transparent 60%),
    linear-gradient(180deg,#121217,#0a0a0d);
  border:1px solid #2a2a33; border-radius:16px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.6); }
.pk-card::before { content:""; position:absolute; inset:0; pointer-events:none;
  background: repeating-linear-gradient(115deg, transparent 0 22px, rgba(255,255,255,.018) 22px 23px); }
.pk-top { display:flex; align-items:center; justify-content:space-between; padding:10px 14px 0; position:relative; }
.pk-brand { font-family:var(--display); font-size:13px; letter-spacing:.06em; color:var(--red-hot); }
.pk-brand span { color:var(--gold); margin-left:3px; font-family:"Noto Sans JP"; font-weight:900; font-size:11px; letter-spacing:.08em; }
.pk-date { font-family:var(--num); font-size:11px; color:var(--muted); letter-spacing:.04em; }
.pk-ev { position:relative; padding:2px 14px 0; font-family:var(--display); font-size:24px; line-height:1.1; letter-spacing:.01em; }
.pk-hero { position:relative; display:flex; align-items:center; gap:12px; padding:12px 14px 12px; }
.pk-ava { width:46px; height:46px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
  font-weight:900; font-size:20px; color:#0a0a0d; box-shadow:0 0 0 3px rgba(255,255,255,.08); }
.pk-whowrap { flex:1; min-width:0; }
.pk-name { font-weight:900; font-size:22px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pk-sub { font-size:10.5px; color:var(--muted); margin-top:2px; }
.pk-ring { position:relative; width:74px; height:74px; flex:none; }
.pk-ring svg { width:100%; height:100%; transform:rotate(-90deg); }
.pk-ring .val { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.pk-ring b { font-family:var(--num); font-weight:700; font-size:22px; line-height:1; color:var(--gold-hot); }
.pk-ring small { font-size:9px; color:var(--muted); margin-top:2px; }
.pk-tally { position:relative; display:flex; gap:6px; padding:0 14px 10px; }
.pk-tally span { font-family:var(--num); font-size:12px; font-weight:700; padding:2px 9px; border-radius:999px; border:1px solid #2e2e38; background:#15151b; }
.pk-tally .t-hit { color:#47d16c; border-color:#1f5d31; } .pk-tally .t-miss { color:#ff6b75; border-color:#6a1d25; }
.pk-tally .t-pit { color:var(--gold-hot); border-color:#6b5a1d; } .pk-tally .t-n { color:var(--muted); }
.pk-bar { height:3px; background:linear-gradient(90deg,var(--red),var(--red-hot) 40%,var(--gold) 100%); position:relative; }
.pk-list { position:relative; padding:4px 10px 4px; }
.pk-row { display:flex; align-items:center; gap:9px; padding:6px 2px; border-bottom:1px solid rgba(255,255,255,.06); }
.pk-row:last-child { border-bottom:none; }
.pk-row.cxl { opacity:.5; }
.pk-no { width:24px; flex:none; font-family:var(--num); font-size:11px; font-weight:700; color:#7a7a86; text-align:center; }
.pk-face { width:36px; height:36px; flex:none; border-radius:50%; object-fit:cover; object-position:50% 12%;
  border:2.5px solid; background:#1b1b23; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; }
.pk-face { background-size:cover; background-position:50% 15%; }
.pk-face.bn { background-size:auto 150%; }
.pk-face.bn.l { background-position:12% 18%; } .pk-face.bn.r { background-position:88% 18%; }
.pk-face.red { border-color:var(--red-hot); color:#ff8a93; } .pk-face.blue { border-color:var(--blue-hot); color:#8fb8ff; }
.pk-mid { flex:1; min-width:0; line-height:1.2; }
.pk-w { display:block; font-weight:900; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pk-w.red { color:#ff5a67; } .pk-w.blue { color:#5aa0ff; }
.pk-how { color:var(--gold-hot); font-weight:700; font-size:10.5px; margin-right:6px; }
.pk-vs { display:block; font-size:10px; color:#7f7f8a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
.pk-res { flex:none; min-width:46px; text-align:right; }
.pk-mk { display:inline-block; font-weight:900; font-size:13px; min-width:30px; text-align:center; padding:2px 6px; border-radius:6px; }
.pk-mk.hit { background:#1f8a3e; color:#fff; } .pk-mk.miss { background:#2a1013; color:#ff6b75; border:1px solid #6a1d25; }
.pk-mk.pit { background:linear-gradient(135deg,#f0cd5a,#b8902a); color:#141009; font-size:11px; }
.pk-mk.pend { color:#9a9aa6; font-size:11px; font-weight:700; padding:0; }
.pk-real { display:block; font-size:9px; color:#6f6f7a; margin-top:2px; white-space:nowrap; }
.pk-cxl { font-size:10px; color:#ff6b6b; border:1px solid #7a1520; border-radius:4px; padding:0 5px; }
.pk-nonesum { padding:6px 4px 2px; font-size:10.5px; color:#6a6a72; text-align:center; }
.pk-src { position:relative; margin:4px 12px 0; padding:7px 10px; border-radius:8px; background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.06); font-size:9.5px; color:#a4a4b0; line-height:1.45; }
.pk-src b { color:#d8d8e0; font-weight:700; }
.pk-src .u { color:#8a8a96; word-break:break-all; }
.pk-foot { position:relative; display:flex; justify-content:space-between; align-items:center; padding:8px 14px 10px; font-size:9.5px; color:#6f6f7a; }
.pk-foot .site { font-family:var(--num); font-size:11px; color:var(--gold); letter-spacing:.02em; }
.pk-empty { padding:30px; text-align:center; color:#8a8a92; }
.pk-actions { max-width:440px; margin: 12px auto 0; padding:0 10px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.pk-actions button, .pk-actions a { background:#1a1a20; color:#eee; border:1px solid #33333a; border-radius:8px;
  padding:9px 14px; font-size:12.5px; cursor:pointer; }
.pk-hint { max-width:440px; margin:8px auto 0; text-align:center; font-size:10.5px; color:#6a6a72; }
</style>
</head>
<body>
<div class="pk-wrap"><div class="pk-card" id="card"><div class="pk-empty">読み込み中…</div></div></div>
<div class="pk-actions" id="acts"></div>
<p class="pk-hint">この画面をそのままスクショすると、Xで1枚に収まります。</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=20261019224115"></script>
<script src="js/techniques.js?v=20261019224115"></script>
<script src="js/demo-data.js?v=20261019224115"></script>
<script src="js/api.js?v=20261019224115"></script>
<script src="js/app.js?v=20261019224115"></script>
<script>
// 決着の表示ラベル（結果側）。fights.result_method は KO / SUB / DEC / DRAW / NC。
const RES_LABEL = { KO: "KO", SUB: "一本", DEC: "判定", DRAW: "ドロー", NC: "無効" };
const ini = (name) => esc((name || "?").replace(/[“”"].*?[“”"]/g, "").trim().slice(0, 1));
// 顔：①人が選んだ生写真（action_photo）②その試合の公式VSバナーの左右（fighter1=左が構図として保証）③頭文字。
function face(f, side, banner) {
  if (f && f.action_photo) return `<span class="pk-face ${side}" style="background-image:url('${esc(f.action_photo)}')"></span>`;
  if (banner) return `<span class="pk-face ${side} bn ${side === "red" ? "l" : "r"}" style="background-image:url('${esc(banner)}')"></span>`;
  return `<span class="pk-face ${side}">${ini(f && f.name)}</span>`;
}
function ring(rate) {
  const r = 31, c = 2 * Math.PI * r, v = rate == null ? 0 : rate;
  return `<svg viewBox="0 0 74 74"><circle cx="37" cy="37" r="${r}" fill="none" stroke="#24242c" stroke-width="6"/>
    ${v > 0 ? `<circle cx="37" cy="37" r="${r}" fill="none" stroke="url(#pkg)" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${(c * v).toFixed(1)} ${c.toFixed(1)}"/>` : ""}
    <defs><linearGradient id="pkg" x1="0" x2="1"><stop offset="0" stop-color="#ff2436"/><stop offset="1" stop-color="#f0cd5a"/></linearGradient></defs></svg>`;
}
async function loadSources() {
  try { const r = await fetch("data/sources.json?v=20261019"); return r.ok ? await r.json() : {}; }
  catch (e) { return {}; }
}
async function load() {
  const evId = qp("event"), memId = qp("member");
  const card = document.getElementById("card");
  if (!evId || !memId) { card.innerHTML = "<div class='pk-empty'>予想者と大会を指定してください。</div>"; return; }
  const [ev, members, fighters, SRC] = await Promise.all([DB.getEvent(evId), DB.listMembers(), DB.listFighters(), loadSources()]);
  const FMAP = fighterMap(fighters);
  const me = members.find(m => m.id === memId);
  if (!ev || !me) { card.innerHTML = "<div class='pk-empty'>見つかりませんでした。</div>"; return; }
  // 中止試合も残す（予想していた記録が消えるのは不誠実。「中止」と出す）
  const fights = (await DB.listFights(evId)).sort((a, b) => b.order_no - a.order_no);
  const fightIds = fights.map(f => f.id);
  const preds = await DB.listPredictions({ fightIds, memberId: memId });
  const predBy = Object.fromEntries(preds.map(p => [p.fight_id, p]));
  const allPreds = await DB.listPredictions({ fightIds });

  let decided = 0, hits = 0, pitari = 0;
  const rows = [], none = [];
  for (const f of fights) {
    const p = predBy[f.id];
    if (!p) { none.push(f); continue; }
    const f1 = FMAP[f.fighter1_id], f2 = FMAP[f.fighter2_id];
    const no = f.segment === "opening" ? `OP${f.order_no}` : `${f.order_no}`;
    const side = p.winner_id === f.fighter1_id ? "red" : "blue";
    const w = FMAP[p.winner_id], opp = side === "red" ? f2 : f1;
    const kim = p.method === "DEC" ? "判定" : (p.technique ? TECH_LABEL[p.technique] : (p.method === "SUB" ? "一本" : p.method === "KO" ? "KO" : ""));
    const how = [kim, (p.method !== "DEC" && p.round) ? `${p.round}R` : ""].filter(Boolean).join(" ");
    const cp = allPreds.filter(x => x.fight_id === f.id);
    const cpct = cp.length > 1 ? Math.round(cp.filter(x => x.winner_id === p.winner_id).length / cp.length * 100) : null;
    const s2 = window.scoreFight(p, f, { scope: "event" });
    let mk, real = "";
    if (f.cancelled) mk = `<span class="pk-cxl">中止</span>`;
    else if (s2 && s2.counted) {
      decided++; if (s2.winnerHit) hits++; if (s2.pitari) pitari++;
      mk = s2.pitari ? `<span class="pk-mk pit">ピタリ</span>`
        : s2.winnerHit ? `<span class="pk-mk hit">○</span>` : `<span class="pk-mk miss">✕</span>`;
      const rl = [RES_LABEL[f.result_method] || "", (f.result_method !== "DEC" && f.result_round) ? `${f.result_round}R` : ""].filter(Boolean).join(" ");
      if (rl) real = esc(rl);   // 外れ＝相手の勝ちなので、勝者名は出さず決着だけ
    } else if (f.winner_id || f.result_method) {
      mk = `<span class="pk-mk pend">対象外</span>`;
    } else {
      mk = cpct != null ? `<span class="pk-mk pend">${cpct}%</span>` : `<span class="pk-mk pend">—</span>`;
      if (cpct != null) real = "同意見";
    }
    rows.push(`<div class="pk-row${f.cancelled ? " cxl" : ""}">
      <span class="pk-no">${no}</span>
      ${face(w, side, f.image_url)}
      <div class="pk-mid">
        <span class="pk-w ${side}">${esc(w?.name)}</span>
        <span class="pk-vs">${how ? `<span class="pk-how">${esc(how)}</span>` : ""}vs ${esc(opp?.name)}</span>
      </div>
      <div class="pk-res">${mk}${real ? `<span class="pk-real">${real}</span>` : ""}</div>
    </div>`);
  }
  const noneRow = none.length ? `<div class="pk-nonesum">ほか${none.length}試合は予想なし</div>` : "";
  const rate = decided ? hits / decided : null;
  const ringBox = decided
    ? `<div class="pk-ring">${ring(rate)}<div class="val"><b>${Math.round(rate * 100)}%</b><small>的中率</small></div></div>`
    : `<div class="pk-ring">${ring(0)}<div class="val"><b>${preds.length}</b><small>試合予想</small></div></div>`;
  const tally = decided
    ? `<div class="pk-tally"><span class="t-hit">○ ${hits}</span><span class="t-miss">✕ ${decided - hits}</span>${pitari ? `<span class="t-pit">ピタリ ${pitari}</span>` : ""}<span class="t-n">${decided}試合決着</span></div>`
    : `<div class="pk-tally"><span class="t-pit">${preds.length}試合を予想</span>${daysToEvent(ev) > 0 ? `<span class="t-n">決戦まで${daysToEvent(ev)}日</span>` : ""}</div>`;

  // 出典：台帳由来（site/data/sources.json）。美食会メンバー本人の予想には出典欄は無い。
  const src = (SRC[memId] || {})[evId] || [];
  const short = (u) => { const m = u.match(/(?:v=|live\/)([\w-]{11})/); return m ? `youtu.be/${m[1]}` : u.replace(/^https:\/\/(www\.)?/, ""); };
  const chans = [...new Set(src.map(x => x.channel))];
  const srcBox = src.length
    ? `<div class="pk-src">出典：<b>${chans.map(esc).join("／")}</b>（YouTube${src.length > 1 ? `・${src.length}本` : ""}）<br>
        <span class="u">${src.slice(0, 2).map(x => `${esc(x.date.slice(5).replace("-", "/"))} ${esc(short(x.url))}`).join("　")}${src.length > 2 ? "　ほか" : ""}</span></div>`
    : "";
  const sub = src.length ? "YouTube予想（本人発言から抽出）" : "美食会メンバー";

  card.innerHTML = `
    <div class="pk-top"><span class="pk-brand">RIZIN<span>美食会予想</span></span><span class="pk-date">${esc(fmtDate(ev.event_date))}</span></div>
    <div class="pk-ev">${esc(ev.name)}</div>
    <div class="pk-hero">
      <span class="pk-ava" style="background:${esc(me.color || "#e60012")}">${ini(me.name)}</span>
      <div class="pk-whowrap"><div class="pk-name">${esc(me.name)}</div><div class="pk-sub">${sub}</div></div>
      ${ringBox}
    </div>
    ${tally}
    <div class="pk-bar"></div>
    <div class="pk-list">${rows.join("")}${noneRow}</div>
    ${srcBox}
    <div class="pk-foot"><span class="site">${esc(window.SITE_URL)}</span><span>#RIZIN美食会予想</span></div>`;

  const share = `${me.name}の${ev.name}予想${decided ? `（的中率${Math.round(rate * 100)}%）` : ""} #RIZIN美食会予想`;
  document.getElementById("acts").innerHTML =
    window.shareButton(share, location.href, "この予想カードをポスト") +
    ` <a href="event.html?id=${esc(evId)}">大会ページへ</a>` +
    ` <a href="predictor.html?id=${esc(memId)}">${esc(me.name)}の戦績</a>`;
}
load();
</script>
</body>
</html>
