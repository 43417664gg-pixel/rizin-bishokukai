<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ランキング｜予想番付</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261108035135">
<style>
/* ランキングを1枚のカードにする（2026-10-20）：スクショ単体でXに貼れるよう、
   ブランド・集計対象・サイトURLをカードの中に入れる。名前をタップ→その人の戦績へ。 */
.rk-card { position:relative; overflow:hidden; margin:6px 0 4px; border-radius:16px; border:1px solid #2a2a33;
  background:
    radial-gradient(120% 50% at 100% 0%, rgba(230,0,18,.20), transparent 55%),
    radial-gradient(90% 50% at 0% 100%, rgba(212,175,55,.08), transparent 60%),
    linear-gradient(180deg,#121217,#0a0a0d);
  box-shadow:0 10px 40px rgba(0,0,0,.55); }
.rk-card::before { content:""; position:absolute; inset:0; pointer-events:none;
  background: repeating-linear-gradient(115deg, transparent 0 22px, rgba(255,255,255,.018) 22px 23px); }
/* 頭は「題」と「集計範囲」の2つだけ（Gaku 11/7「ここもごちゃついてんな」：上のロゴ・英字 RANKING・金の枠の説明が重なっていた）。
   題は節の見出しと同じ型（赤い斜めの印→極太）。ロゴは下の帯に1回だけ（スクショで回っても名前が残る） */
.rk-head { position:relative; padding:18px 14px 10px; }
.rk-ttl { display:flex; align-items:center; gap:10px; font:900 24px/1.15 var(--display); font-synthesis:none; letter-spacing:.02em; color:var(--text); }
.rk-ttl::before { content:""; flex:none; width:8px; height:24px; background:var(--red); transform:skewX(-18deg); }
.rk-card .rk-scope { margin:0; padding:6px 0 0 18px; font:700 12px/1.45 "Noto Sans JP", sans-serif; letter-spacing:.06em; color:#9d9daa; }
.rk-card .lb-table { position:relative; }
.rk-card .lb-table th { padding-left:6px; padding-right:10px; }
.rk-card .lb-table td:first-child, .rk-card .lb-table th:first-child { padding-left:12px; }
.rk-card .lb-table td:last-child, .rk-card .lb-table th:last-child { padding-right:12px; }
.rk-card .lb-table tr:last-child td { border-bottom:none; }
/* 11人並んでもスマホ1画面（812px）に収まる行の高さに詰める */
.rk-card .lb-table td { padding-top:5px !important; padding-bottom:5px !important; }
.rk-card .lb-table th { padding-top:4px !important; padding-bottom:4px !important; font-size:10px; }
.rk-card .lb-rank { font-size:18px; width:30px; }
.rk-card .lb-pt { font-size:20px; }
.rk-card .lb-table .lb-rate { font-size:19px !important; }
.rk-card .lb-table .lb-rate.thin { font-size:15px !important; }
.rk-card .lb-sub { font-size:9.5px; line-height:1.3; }
.rk-card .lb-table .lb-name { font-size:14px !important; line-height:1.3; }
.rk-card .pit-btn { transform:scale(.85); }
/* 2026-11-07 勝敗だけのランキングへ：数字は大きく2つ（的中数・的中率）だけ。小さい字を減らす */
.rk-card .lb-table td { padding-top:9px !important; padding-bottom:9px !important; }
.rk-card .lb-table th { font-size:11px; }
.lb-hit { font-family:var(--num); font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
.lb-of { font-family:var(--num); font-size:14px; color:var(--muted); margin-left:2px; }
tr.top .lb-hit { color:var(--gold-hot); }
.rk-card .lb-table .lb-rate { font-size:17px !important; color:#c9c9d2; }
.rk-card .lb-table .lb-rate.thin { color:var(--muted); }
.rk-mode { display:flex; gap:6px; margin:4px 0 8px; }
.rk-mode button { flex:1; padding:9px 0; border-radius:8px; border:1px solid #2a2a33; background:#121217;
  color:#9a9aa2; font-weight:900; font-size:14px; cursor:pointer; }
.rk-mode button.on { border-color:var(--gold); color:var(--gold-hot); background:#17150d; }
/* 順位の決まり方は表の後に1行だけ（説明は最後に1行・黄色で面を塗らない） */
.rk-rule { position:relative; margin:0; padding:10px 14px 8px; font:700 11px/1.5 "Noto Sans JP", sans-serif; letter-spacing:.04em; color:var(--muted); }
.rk-empty { padding:18px 14px; text-align:center; color:var(--muted); font-size:13px; }
a.lb-name { display:inline-block; border-bottom:1px dashed rgba(255,255,255,.25); }
.rk-card .lb-table .lb-name.long { font-size:12px !important; }
a.lb-name:active { color:var(--gold-hot); }
.rk-foot { position:relative; display:flex; justify-content:space-between; align-items:center; padding:10px 14px 12px;
  border-top:1px solid rgba(255,255,255,.06); white-space:nowrap; gap:8px; }
.rk-logo { padding:5px 9px 4px 8px; font:900 12px/1 "Noto Sans JP", sans-serif; letter-spacing:.1em; color:#fff;
  background:linear-gradient(180deg, var(--red-hot), var(--red)); clip-path:polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
.rk-foot .site { min-width:0; overflow:hidden; text-overflow:ellipsis; font:500 11px/1 var(--num); letter-spacing:.02em; color:#7a7a86; }
.rk-tap { font-size:11px; color:#6a6a72; text-align:center; margin:6px 0 0; }
</style>
</head>
<body>
<div id="app-header"></div>
<div class="wrap" id="main"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20261108035135"></script>
<script src="js/techniques.js?v=20261108035135"></script>
<script src="js/demo-data.js?v=20261108035135"></script>
<script src="js/api.js?v=20261108035135"></script>
<script src="js/app.js?v=20261108035135"></script>
<script src="js/glyph_fit.js?v=20261108035135"></script>
<script>
let EVENTS, MEMBERS, ALL_FIGHTS, ALL_PREDS, FMAP = {};
let checked = new Set();   // 集計対象の大会ID（＋PAST）
// サイト開設前の予想動画の遡り採点（data/career）。通算の数字にだけ足す（Gaku指示11/7「過去動画の実績も入れていいよ。数字としてだけ」）。
// 大会ページの予想一覧には出さない。チェック欄では「サイト開設前の動画」を1つの大会のように扱う
const PAST = "_past";
let RETRO = {};            // member_id → 遡り採点の予想
let MODE = "win";          // win＝勝敗ランキング（本体）／pitari＝ピタリランキング（おまけ）
window.PITARI = {};        // member_id → ピタリの内訳（どこで何が）

async function load() {
  await renderHeader("ranking");
  let FIGHTERS;
  [EVENTS, MEMBERS, ALL_FIGHTS, FIGHTERS] = await Promise.all([DB.listEvents(), DB.listMembers(), DB.listFights(), DB.listFighters()]);
  FMAP = fighterMap(FIGHTERS);
  [ALL_PREDS, RETRO] = await Promise.all([DB.listPredictions({}), loadRetro()]);
  checked = new Set([...EVENTS.map(e => e.id), PAST]);  // 初期状態＝全選択
  await window.AVATARS_READY;
  render();
}

function toggleEvent(id) {
  if (checked.has(id)) checked.delete(id); else checked.add(id);
  render();
}
function setMode(m) { MODE = m; render(); }
function toggleAll(on) {
  checked = on ? new Set([...EVENTS.map(e => e.id), PAST]) : new Set();
  render();
}
async function loadRetro() {
  try {
    const ids = await (await fetch("data/career/index.json", { cache: "no-cache" })).json();
    const out = {};
    await Promise.all(ids.map(async id => {
      const r = await fetch(`data/career/${encodeURIComponent(id)}.json`, { cache: "no-cache" });
      if (r.ok) out[id] = (await r.json()).picks || [];
    }));
    return out;
  } catch (e) { return {}; }
}
// 遡り採点のうち、いま集計に入れる分を数える。サイトに載っている大会（portal_event）は、
// その人のDBの予想がその大会で1件でも採点されていればDBが正＝遡り分は数えない（戦績ページと同じ規則・二重に数えない）。
// DBに無い大会（広島＝サイト公開前）だけ遡り分を使う。サイト以前の大会は「サイト開設前の動画」のチェックで出し入れ
function retroExtra() {
  const fById = Object.fromEntries(ALL_FIGHTS.map(f => [f.id, f]));
  const live = {};
  for (const p of ALL_PREDS) {
    const f = fById[p.fight_id]; if (!f) continue;
    const s = scoreFight(p, f, { scope: "career" });
    if (s && s.counted) (live[p.member_id] ||= new Set()).add(f.event_id);
  }
  const out = {};
  for (const [mid, picks] of Object.entries(RETRO)) {
    const x = { answered: 0, decided: 0, hits: 0 };
    for (const k of picks) {
      const ev = k.portal_event;
      if (ev ? (!checked.has(ev) || live[mid]?.has(ev)) : !checked.has(PAST)) continue;
      x.answered += 1; x.decided += 1; if (k.hit) x.hits += 1;
    }
    if (x.decided) out[mid] = x;
  }
  return out;
}

function render() {
  const fights = ALL_FIGHTS.filter(f => checked.has(f.event_id));
  const fightIds = new Set(fights.map(f => f.id));
  const preds = ALL_PREDS.filter(p => fightIds.has(p.fight_id));
  // 大会が1つだけ選ばれていれば「その大会の的中率」＝event、複数なら通算＝career。
  // event_only（キック等）は career では数えない（Gaku確定・2026-08-21）。
  const evOn = EVENTS.filter(e => checked.has(e.id));
  const single = evOn.length === 1 && !checked.has(PAST) ? evOn[0] : null;   // 大会1つだけ＝その大会の成績
  const scope = single ? "event" : "career";
  const extra = retroExtra();
  const allRows = computeLeaderboard(MEMBERS.filter(m => !window.RANK_HIDDEN.includes(m.id)), fights, preds, { scope, extra });
  // 通算は確定8試合以上でランクイン。未満は下に「ランク外」として出す（除外はしない）。
  const rows = allRows.filter(r => window.isRanked(r, scope));
  const unranked = allRows.filter(r => !window.isRanked(r, scope) && r.answered > 0);
  // ピタリの内訳（どの試合で・誰を・何で当てたか）をメンバー別に用意
  const fById = Object.fromEntries(fights.map(f => [f.id, f]));
  window.PITARI = {};
  for (const p of preds) {
    const f = fById[p.fight_id]; if (!f) continue;
    const s = scoreFight(p, f, { scope });
    if (!s || !s.pitari) continue;
    const w = FMAP[p.winner_id];
    const kim = p.method === "DEC" ? "判定" : (p.technique ? (TECH_LABEL[p.technique] || p.technique) : "");
    const kr = [kim, (p.method !== "DEC" && p.round) ? `${p.round}R` : ""].filter(Boolean).join(" ");
    (window.PITARI[p.member_id] ||= []).push(`第${f.order_no} ◎ ${esc(w?.name || "")}　${esc(kr)}`);
  }
  const allOn = evOn.length === EVENTS.length && checked.has(PAST);
  document.getElementById("main").innerHTML = `
    <div class="rk-mode">
      <button class="${MODE === "win" ? "on" : ""}" onclick="setMode('win')">勝敗</button>
      <button class="${MODE === "pitari" ? "on" : ""}" onclick="setMode('pitari')">🎯 ピタリ</button>
    </div>
    <div class="rk-card">
      <div class="rk-head">
        <div class="rk-ttl">${single ? esc(single.name) : MODE === "win" ? "勝敗予想ランキング" : "ピタリランキング"}</div>
        <p class="rk-scope">${allOn ? "全大会・通算"
          : single ? `${esc(fmtDate(single.event_date))}・この大会の成績`
          : [...evOn.map(e => esc(e.name)), ...(checked.has(PAST) ? ["サイト開設前の動画"] : [])].join("・") || "なし"}</p>
      </div>
      ${MODE === "win"
        ? `${winTable(rows)}<p class="rk-rule">勝敗の的中${single ? "数" : "率"}で順位。決まり手・ラウンドは関係なし</p>`
        : `${pitariTable(allRows)}<p class="rk-rule">勝ち方・ラウンドまで当てた数。順位には関係なし</p>`}
      <div class="rk-foot"><span class="rk-logo">予想番付</span><span class="site">${esc(window.SITE_URL)}</span></div>
    </div>
    <p class="rk-tap">名前をタップすると、その人の戦績が見られます。</p>

    <div class="section-label">集計する大会</div>
    <div class="ev-checks">
      <label class="ev-check all ${allOn ? "on" : ""}">
        <input type="checkbox" ${allOn ? "checked" : ""} onchange="toggleAll(this.checked)">全大会
      </label>
      ${EVENTS.map(e => `
        <label class="ev-check ${checked.has(e.id) ? "on" : ""}">
          <input type="checkbox" ${checked.has(e.id) ? "checked" : ""} onchange="toggleEvent('${e.id}')">${esc(e.name)}
        </label>`).join("")}
      ${Object.keys(RETRO).length ? `
        <label class="ev-check ${checked.has(PAST) ? "on" : ""}">
          <input type="checkbox" ${checked.has(PAST) ? "checked" : ""} onchange="toggleEvent('${PAST}')">サイト開設前の動画
        </label>` : ""}
    </div>

      ${unranked.length ? `
      <div class="rk-unranked">
        <div class="rk-un-ttl">ランク外（通算${window.CAREER_MIN}試合からランクイン）</div>
        ${unranked.map(r => `<div class="rk-un-row"><span>${esc(r.member.name)}</span>
          <span class="rk-un-n">${r.hits}的中・確定${r.decided}試合<b>（あと${window.CAREER_MIN - r.decided}）</b></span></div>`).join("")}
      </div>` : ""}
      <div class="rk-share">${window.shareButton(
        (single ? single.name + "の" : "") +
        "勝敗予想ランキング" + (rows[0] && rows[0].rate !== null ? `　1位 ${rows[0].member.name}（${rows[0].hits}/${rows[0].decided}的中）` : "") +
        " #予想番付", location.href, "ランキングをポスト")}</div>
      通算は<b>的中率</b>で並べる。同じ率なら当てた数が多い方が上。1大会だけの表示は<b>当てた数</b>で並べる（1試合で1的中＝100%が1位にならないように）。<br>
      <b>ピタリ</b>（決まり手＋ラウンドまで一致・判定は「判定」で一致）は上の「🎯 ピタリ」タブで。<br>
      通算は結果の出た予想8試合からランクイン（美食会の3人はいつでも掲載）。<br>
      通算には、サイト開設前のYouTube予想動画の採点結果（${Object.keys(RETRO).length}人）も数字だけ含む（勝敗のみ・大会ページには出さない）。<br>
      予想しなかった試合・中止・体重超過・ドロー・無効試合は数えない。`;
}

// 同じ成績は同じ順位（1,1,3…）
function rankOf(list, i, same) {
  let j = i;
  while (j > 0 && same(list[j - 1], list[i])) j--;
  return j + 1;
}

// 的中率が競ったら小数点まで出す（Gaku指示・2026-11-07「せったときは小数点まで」）。
// 隣り合う行が同じ整数の%に丸まるのに率は違う、という並びだけ、違いが見える桁（最大2桁）まで出す
function rateLabels(rows) {
  const pct = r => r.rate === null ? null : Math.round(r.rate * 100);
  const out = rows.map(r => fmtRate(r.rate));
  for (let i = 0; i < rows.length; ) {
    let j = i + 1;
    while (j < rows.length && pct(rows[i]) !== null && pct(rows[j]) === pct(rows[i])) j++;
    const grp = rows.slice(i, j);
    const n = new Set(grp.map(r => r.rate)).size;
    if (n > 1) {
      let d = 1;
      while (d < 2 && new Set(grp.map(r => (r.rate * 100).toFixed(d))).size < n) d++;
      grp.forEach((r, k) => { out[i + k] = `${(r.rate * 100).toFixed(d)}%`; });
    }
    i = j;
  }
  return out;
}

function winTable(rows) {
  if (!rows.length) return `<div class="rk-empty">まだ結果の出た予想がありません</div>`;
  const same = (a, b) => a.hits === b.hits && a.decided === b.decided;
  const rl = rateLabels(rows);
  return `
      <table class="lb-table">
        <tr><th></th><th></th><th>的中</th><th>的中率</th></tr>
        ${rows.map((r, i) => `
          <tr class="${r.rate !== null && rankOf(rows, i, same) === 1 ? "top" : ""}">
            <td class="lb-rank">${r.rate === null ? "—" : rankOf(rows, i, same)}</td>
            <td><span class="lb-who">${avatarHTML(r.member, "lb-ava")}<a class="lb-name${String(r.member.name).length >= 9 ? " long" : ""}" href="predictor.html?id=${esc(r.member.id)}">${esc(r.member.name)}</a></span></td>
            <td><span class="lb-hit">${r.hits}</span><span class="lb-of">/${r.decided}</span></td>
            <td><span class="lb-rate${r.decided < window.RATE_MIN ? " thin" : ""}">${rl[i]}</span></td>
          </tr>`).join("")}
      </table>`;
}

function pitariTable(allRows) {
  const rows = allRows.filter(r => r.pitari > 0)
    .sort((a, b) => b.pitari - a.pitari || b.hits - a.hits ||
                    String(a.member.name).localeCompare(String(b.member.name), "ja"));
  if (!rows.length) return `<div class="rk-empty">この範囲ではまだピタリが出ていません</div>`;
  const same = (a, b) => a.pitari === b.pitari;
  return `
      <table class="lb-table">
        <tr><th></th><th></th><th>ピタリ</th></tr>
        ${rows.map((r, i) => `
          <tr class="${rankOf(rows, i, same) === 1 ? "top" : ""}">
            <td class="lb-rank">${rankOf(rows, i, same)}</td>
            <td><span class="lb-who">${avatarHTML(r.member, "lb-ava")}<a class="lb-name${String(r.member.name).length >= 9 ? " long" : ""}" href="predictor.html?id=${esc(r.member.id)}">${esc(r.member.name)}</a></span></td>
            <td><span class="pit-cell" tabindex="0" onclick="this.classList.toggle('open')">
                  <span class="pit-btn">${r.pitari}</span>
                  <span class="pit-pop"><b class="pit-head">🎯 ${esc(r.member.name)} のピタリ</b>${(window.PITARI[r.member.id] || []).map(s => `<span class="pit-row">${s}</span>`).join("")}</span>
                </span></td>
          </tr>`).join("")}
      </table>`;
}

window.showPitari = function (mid) {
  const list = (window.PITARI[mid] || []);
  const m = MEMBERS.find(x => x.id === mid);
  const el = document.getElementById("pitari-detail");
  if (!el) return;
  el.innerHTML = list.length
    ? `<div class="pit-head">🎯 ${esc(m ? m.name : "")} のピタリ（${list.length}）</div>${list.map(s => `<div class="pit-row">${s}</div>`).join("")}`
    : "";
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
};

load();
</script>
</body>
</html>
