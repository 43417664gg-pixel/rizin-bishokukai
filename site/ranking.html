<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ランキング｜RIZIN美食会予想</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260811203259">
</head>
<body>
<div id="app-header"></div>
<div class="wrap" id="main"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=20260811203259"></script>
<script src="js/techniques.js?v=20260811203259"></script>
<script src="js/demo-data.js?v=20260811203259"></script>
<script src="js/api.js?v=20260811203259"></script>
<script src="js/app.js?v=20260811203259"></script>
<script>
let EVENTS, MEMBERS, ALL_FIGHTS, ALL_PREDS;
let checked = new Set();   // 集計対象の大会ID

async function load() {
  await renderHeader("ranking");
  [EVENTS, MEMBERS, ALL_FIGHTS] = await Promise.all([DB.listEvents(), DB.listMembers(), DB.listFights()]);
  ALL_PREDS = await DB.listPredictions({});
  checked = new Set(EVENTS.map(e => e.id));  // 初期状態＝全選択
  render();
}

function toggleEvent(id) {
  if (checked.has(id)) checked.delete(id); else checked.add(id);
  render();
}
function toggleAll(on) {
  checked = on ? new Set(EVENTS.map(e => e.id)) : new Set();
  render();
}

function render() {
  const fights = ALL_FIGHTS.filter(f => checked.has(f.event_id));
  const fightIds = new Set(fights.map(f => f.id));
  const preds = ALL_PREDS.filter(p => fightIds.has(p.fight_id));
  const rows = computeLeaderboard(MEMBERS, fights, preds);
  const allOn = checked.size === EVENTS.length;
  document.getElementById("main").innerHTML = `
    <div class="en-label">RANKING</div>
    <h1 class="page-title">ランキング</h1>
    <p class="page-sub">的中率で称号を上げろ。ルーキーから絶対王者まで。</p>

    <table class="lb-table">
      <tr><th></th><th>名前</th><th>称号</th><th>的中率</th><th>ピタリ</th></tr>
      ${rows.map((r, i) => { const t = tierOf(r); return `
        <tr class="${i === 0 && r.rate !== null ? "top" : ""}">
          <td class="lb-rank">${r.rate === null ? "—" : i + 1}</td>
          <td><div class="lb-name">${esc(r.member.name)}</div>
              <div class="lb-sub">予想 ${r.answered}試合</div></td>
          <td><span style="font-weight:900;color:${t.color};white-space:nowrap;font-size:13px">${t.icon} ${t.name}</span></td>
          <td><span class="lb-rate">${fmtRate(r.rate)}</span>
              <div class="lb-sub">${r.hits}/${r.decided}</div></td>
          <td class="lb-num">${r.pitari}</td>
        </tr>`; }).join("")}
    </table>

    <div class="section-label">集計する大会</div>
    <div class="ev-checks">
      <label class="ev-check all ${allOn ? "on" : ""}">
        <input type="checkbox" ${allOn ? "checked" : ""} onchange="toggleAll(this.checked)">全大会
      </label>
      ${EVENTS.map(e => `
        <label class="ev-check ${checked.has(e.id) ? "on" : ""}">
          <input type="checkbox" ${checked.has(e.id) ? "checked" : ""} onchange="toggleEvent('${e.id}')">${esc(e.name)}
        </label>`).join("")}
    </div>

    <div class="section-label">称号ラダー</div>
    <div style="display:flex;flex-direction:column;gap:6px;margin:8px 0 4px">
      ${TIERS.map(t => `
        <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:#131318;border-left:3px solid ${t.color};border-radius:6px">
          <span style="font-size:20px">${t.icon}</span>
          <b style="color:${t.color};min-width:96px;font-size:14px">${t.name}</b>
          <span style="font-size:12px;color:#9a9aa2">${t.min > 0 ? `的中率 ${Math.round(t.min * 100)}% 以上` : "それ未満／記録が溜まるまで"}</span>
        </div>`).join("")}
    </div>
    <p class="ladder-note">※ 結果の出た予想が <b>${window.TIER_MIN_DECIDED}試合</b> 溜まると称号がつく。<br>
      <b>的中</b>＝勝者を当てる（ランキングの本体）。<b>ピタリ</b>＝決まり手＋ラウンドまで一致（判定は「判定」を当てればピタリ）。<br>
      勝者を外したらその先は不成立。予想しなかった試合はノーカウント。ドロー・無効試合は除外。</p>`;
}

load();
</script>
</body>
</html>
