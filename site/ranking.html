<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ランキング｜RIZIN美食会予想</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261019224115">
<style>
/* ランキングを1枚のカードにする（2026-10-20）：スクショ単体でXに貼れるよう、
   ブランド・集計対象・サイトURLをカードの中に入れる。名前をタップ→その人の戦績へ。 */
.rk-card { position:relative; overflow:hidden; margin:6px 0 4px; border-radius:16px; border:1px solid #2a2a33;
  background:
    radial-gradient(120% 50% at 100% 0%, rgba(230,0,18,.20), transparent 55%),
    radial-gradient(90% 50% at 0% 100%, rgba(212,175,55,.08), transparent 60%),
    linear-gradient(180deg,#121217,#0a0a0d);
  box-shadow:0 10px 40px rgba(0,0,0,.55); }
.rk-card::before { content:""; position:absolute; inset:0; pointer-events:none;
  background: repeating-linear-gradient(115deg, transparent 0 22px, rgba(255,255,255,.018) 22px 23px); }
.rk-top { position:relative; display:flex; justify-content:space-between; align-items:center; padding:10px 14px 0; }
.rk-brand { font-family:var(--display); font-size:13px; letter-spacing:.06em; color:var(--red-hot); }
.rk-brand span { color:var(--gold); margin-left:3px; font-family:"Noto Sans JP"; font-weight:900; font-size:11px; letter-spacing:.08em; }
.rk-tag { font-family:var(--display); font-size:12px; letter-spacing:.14em; color:#8a8a96; }
.rk-ttl { position:relative; padding:0 14px; font-family:var(--display); font-size:22px; line-height:1.15; }
.rk-card .rk-scope { position:relative; padding:2px 14px 6px; margin:0; font-size:11px; }
.rk-card .lb-table { position:relative; }
.rk-card .lb-table th { padding-left:6px; padding-right:10px; }
.rk-card .lb-table td:first-child, .rk-card .lb-table th:first-child { padding-left:12px; }
.rk-card .lb-table td:last-child, .rk-card .lb-table th:last-child { padding-right:12px; }
.rk-card .lb-table tr:last-child td { border-bottom:none; }
/* 11人並んでもスマホ1画面（812px）に収まる行の高さに詰める */
.rk-card .lb-table td { padding-top:5px !important; padding-bottom:5px !important; }
.rk-card .lb-table th { padding-top:4px !important; padding-bottom:4px !important; font-size:10px; }
.rk-card .lb-rank { font-size:18px; width:30px; }
.rk-card .lb-pt { font-size:20px; }
.rk-card .lb-table .lb-rate { font-size:19px !important; }
.rk-card .lb-table .lb-rate.thin { font-size:15px !important; }
.rk-card .lb-sub { font-size:9.5px; line-height:1.3; }
.rk-card .lb-table .lb-name { font-size:14px !important; line-height:1.3; }
.rk-card .pit-btn { transform:scale(.85); }
a.lb-name { display:inline-block; border-bottom:1px dashed rgba(255,255,255,.25); }
a.lb-name:active { color:var(--gold-hot); }
.rk-foot { position:relative; display:flex; justify-content:space-between; align-items:center; padding:8px 14px 10px;
  border-top:1px solid rgba(255,255,255,.06); font-size:9.5px; color:#6f6f7a; white-space:nowrap; gap:8px; }
.rk-foot .site { font-family:var(--num); font-size:11px; color:var(--gold); }
.rk-tap { font-size:11px; color:#6a6a72; text-align:center; margin:6px 0 0; }
</style>
</head>
<body>
<div id="app-header"></div>
<div class="wrap" id="main"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=20261019224115"></script>
<script src="js/techniques.js?v=20261019224115"></script>
<script src="js/demo-data.js?v=20261019224115"></script>
<script src="js/api.js?v=20261019224115"></script>
<script src="js/app.js?v=20261019224115"></script>
<script>
let EVENTS, MEMBERS, ALL_FIGHTS, ALL_PREDS, FMAP = {};
let checked = new Set();   // 集計対象の大会ID
window.PITARI = {};        // member_id → ピタリの内訳（どこで何が）

async function load() {
  await renderHeader("ranking");
  let FIGHTERS;
  [EVENTS, MEMBERS, ALL_FIGHTS, FIGHTERS] = await Promise.all([DB.listEvents(), DB.listMembers(), DB.listFights(), DB.listFighters()]);
  FMAP = fighterMap(FIGHTERS);
  ALL_PREDS = await DB.listPredictions({});
  checked = new Set(EVENTS.map(e => e.id));  // 初期状態＝全選択
  render();
}

function toggleEvent(id) {
  if (checked.has(id)) checked.delete(id); else checked.add(id);
  render();
}
function toggleAll(on) {
  checked = on ? new Set(EVENTS.map(e => e.id)) : new Set();
  render();
}

function render() {
  const fights = ALL_FIGHTS.filter(f => checked.has(f.event_id));
  const fightIds = new Set(fights.map(f => f.id));
  const preds = ALL_PREDS.filter(p => fightIds.has(p.fight_id));
  // 大会が1つだけ選ばれていれば「その大会の的中率」＝event、複数なら通算＝career。
  // event_only（キック等）は career では数えない（Gaku確定・2026-08-21）。
  const scope = checked.size === 1 ? "event" : "career";
  const allRows = computeLeaderboard(MEMBERS, fights, preds, { scope });
  // 通算は確定8試合以上でランクイン。未満は下に「ランク外」として出す（除外はしない）。
  const rows = allRows.filter(r => window.isRanked(r, scope));
  const unranked = allRows.filter(r => !window.isRanked(r, scope) && r.answered > 0);
  // ピタリの内訳（どの試合で・誰を・何で当てたか）をメンバー別に用意
  const fById = Object.fromEntries(fights.map(f => [f.id, f]));
  window.PITARI = {};
  for (const p of preds) {
    const f = fById[p.fight_id]; if (!f) continue;
    const s = scoreFight(p, f, { scope });
    if (!s || !s.pitari) continue;
    const w = FMAP[p.winner_id];
    const kim = p.method === "DEC" ? "判定" : (p.technique ? (TECH_LABEL[p.technique] || p.technique) : "");
    const kr = [kim, (p.method !== "DEC" && p.round) ? `${p.round}R` : ""].filter(Boolean).join(" ");
    (window.PITARI[p.member_id] ||= []).push(`第${f.order_no} ◎ ${esc(w?.name || "")}　${esc(kr)}`);
  }
  const allOn = checked.size === EVENTS.length;
  document.getElementById("main").innerHTML = `
    <div class="rk-card">
      <div class="rk-top"><span class="rk-brand">RIZIN<span>美食会予想</span></span><span class="rk-tag">RANKING</span></div>
      <div class="rk-ttl">${checked.size === 1 ? esc(EVENTS.find(e => checked.has(e.id)).name) : "予想ランキング"}</div>
      <p class="rk-scope">${checked.size === EVENTS.length ? "全大会（通算）"
          : checked.size === 1 ? `${esc(fmtDate(EVENTS.find(e => checked.has(e.id)).event_date))}・この大会の成績`
          : EVENTS.filter(e => checked.has(e.id)).map(e => esc(e.name)).join("・") || "なし"}　<span style="color:#6f6f7a">的中1点・ピタリ+2点</span></p>
      <table class="lb-table">
        <tr><th></th><th>名前</th><th>ポイント</th><th>的中率</th><th>ピタリ</th></tr>
        ${rows.map((r, i) => `
          <tr class="${i === 0 && r.rate !== null ? "top" : ""}">
            <td class="lb-rank">${r.rate === null ? "—" : i + 1}</td>
            <td><a class="lb-name" href="predictor.html?id=${esc(r.member.id)}">${esc(r.member.name)}</a>
                <div class="lb-sub">予想 ${r.answered}試合</div></td>
            <td><span class="lb-pt">${r.points}</span><div class="lb-sub">点</div></td>
            <td><span class="lb-rate${r.decided < window.RATE_MIN ? " thin" : ""}">${fmtRate(r.rate)}</span>
                <div class="lb-sub">${r.hits}/${r.decided}${r.decided && r.decided < window.RATE_MIN ? "・参考" : ""}</div></td>
            <td class="lb-num">${r.pitari
              ? `<span class="pit-cell" tabindex="0" onclick="this.classList.toggle('open')">
                   <span class="pit-btn">${r.pitari}</span>
                   <span class="pit-pop"><b class="pit-head">🎯 ${esc(r.member.name)} のピタリ</b>${(window.PITARI[r.member.id] || []).map(s => `<span class="pit-row">${s}</span>`).join("")}</span>
                 </span>`
              : `<span class="pit-zero">0</span>`}</td>
          </tr>`).join("")}
      </table>
      <div class="rk-foot"><span class="site">${esc(window.SITE_URL)}</span><span>#RIZIN美食会予想</span></div>
    </div>
    <p class="rk-tap">名前をタップすると、その人の戦績が見られます。</p>

    <div class="section-label">集計する大会</div>
    <div class="ev-checks">
      <label class="ev-check all ${allOn ? "on" : ""}">
        <input type="checkbox" ${allOn ? "checked" : ""} onchange="toggleAll(this.checked)">全大会
      </label>
      ${EVENTS.map(e => `
        <label class="ev-check ${checked.has(e.id) ? "on" : ""}">
          <input type="checkbox" ${checked.has(e.id) ? "checked" : ""} onchange="toggleEvent('${e.id}')">${esc(e.name)}
        </label>`).join("")}
    </div>

    <div class="section-label">称号ラダー</div>
    <div style="display:flex;flex-direction:column;gap:6px;margin:8px 0 4px">
      ${TIERS.map(t => `
        <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:#131318;border-left:3px solid ${t.color};border-radius:6px">
          <span style="font-size:20px">${t.icon}</span>
          <b style="color:${t.color};min-width:96px;font-size:14px">${t.name}</b>
          <span style="font-size:12px;color:#9a9aa2">${t.min > 0 ? `的中率 ${Math.round(t.min * 100)}% 以上` : "それ未満／記録が溜まるまで"}</span>
        </div>`).join("")}
    </div>
    <p class="ladder-note">※ 結果の出た予想が <b>${window.TIER_MIN_DECIDED}試合</b> 溜まると称号がつく。<br>
      ${unranked.length ? `
      <div class="rk-unranked">
        <div class="rk-un-ttl">ランク外（通算${window.CAREER_MIN}試合からランクイン）</div>
        ${unranked.map(r => `<div class="rk-un-row"><span>${esc(r.member.name)}</span>
          <span class="rk-un-n">${r.points}点・確定${r.decided}試合<b>（あと${window.CAREER_MIN - r.decided}）</b></span></div>`).join("")}
      </div>` : ""}
      <div class="rk-share">${window.shareButton(
        (checked.size === 1 ? EVENTS.filter(e=>checked.has(e.id))[0].name + "の" : "") +
        "的中率ランキング" + (rows[0] && rows[0].rate !== null ? `　1位 ${rows[0].member.name}（${Math.round(rows[0].rate*100)}%）` : "") +
        " #RIZIN美食会予想", location.href, "ランキングをポスト")}</div>
      <b>ポイント</b>＝ランキングの本体。<b>的中</b>（勝者を当てる）で<b>1点</b>、
      <b>ピタリ</b>（決まり手＋ラウンドまで一致・判定は「判定」を当てればピタリ）ならさらに<b>+2点＝合計3点</b>。<br>
      予想した試合が多いほど得点の機会がある。的中率は参考値で、確定4試合未満は薄く表示。<br>
      <b>通算ランキングは確定8試合から</b>。1大会だけの参加者は「ランク外」に表示される。<br>
      勝者を外したらその先は不成立。予想しなかった試合はノーカウント。ドロー・無効試合は除外。</p>`;
}

window.showPitari = function (mid) {
  const list = (window.PITARI[mid] || []);
  const m = MEMBERS.find(x => x.id === mid);
  const el = document.getElementById("pitari-detail");
  if (!el) return;
  el.innerHTML = list.length
    ? `<div class="pit-head">🎯 ${esc(m ? m.name : "")} のピタリ（${list.length}）</div>${list.map(s => `<div class="pit-row">${s}</div>`).join("")}`
    : "";
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
};

load();
</script>
</body>
</html>
