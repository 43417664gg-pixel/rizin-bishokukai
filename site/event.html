<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>大会予想｜RIZIN美食会予想</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260818205033">
</head>
<body>
<div id="app-header"></div>
<div id="sticky-cd"></div>
<div class="wrap" id="main"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=20260818205033"></script>
<script src="js/techniques.js?v=20260818205033"></script>
<script src="js/demo-data.js?v=20260818205033"></script>
<script src="js/api.js?v=20260818205033"></script>
<script src="js/app.js?v=20260818205033"></script>
<script>
let EV, PHASE, FIGHTS, FMAP, MEMBERS, myPreds = {}, allPreds = [], ALL_SUPPORTS = [];
let drafts = {};              // 決定前の編集中の選択（ローカルのみ）
const editing = new Set();    // 「編集」で開き直した試合ID

// 美食会の3人（ハメ・抜き・丸山）は一覧では左・各カードでは最上部に固定する（Gaku方針）
const FRIEND_IDS = ["m_hame", "m_nuki", "m_maruyama"];
const friendRank = (id) => { const i = FRIEND_IDS.indexOf(id); return i < 0 ? 99 : i; };
// 3人を先頭（固定順）→ 残りは元の順。安定ソート。
const orderMembers = (list) => [...list].sort((a, b) => friendRank(a.id) - friendRank(b.id));
// 結果が出ている時の見せ場ランク（あらます>ピタリ>的中>その他）
const predRank = (s) => s ? (s.aramasu ? 3 : s.pitari ? 2 : s.winnerHit ? 1 : 0) : 0;

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove("show"), 1500);
}

async function load() {
  if (!requireMember()) return;
  await renderHeader("home");
  const id = qp("id");
  EV = id ? await DB.getEvent(id) : null;
  if (!EV) { document.getElementById("main").innerHTML = "<p class='page-sub'>大会が見つかりません。</p>"; return; }
  PHASE = eventPhase(EV);
  FIGHTS = (await DB.listFights(EV.id)).sort((a, b) =>
    (a.segment === b.segment) ? b.order_no - a.order_no : (a.segment === "main" ? -1 : 1));
  FMAP = fighterMap(await DB.listFighters());
  MEMBERS = await DB.listMembers();
  const fightIds = FIGHTS.map(f => f.id);
  // みんなの予想は常時公開のため、受付中でも全員分を取得する（計量前は予想が無い）
  allPreds = PHASE === "before_open"
    ? []
    : await DB.listPredictions({ fightIds });
  myPreds = {};
  for (const p of allPreds.filter(p => p.member_id === getMemberId())) myPreds[p.fight_id] = p;
  // 応援（supportsテーブル未作成でもページを落とさない）
  try { ALL_SUPPORTS = PHASE === "before_open" ? [] : await DB.listSupports({ fightIds }); }
  catch (e) { ALL_SUPPORTS = []; }
  render();
}

// 📣応援：予想とは別に「どっちを応援するか」。締切に関係なくいつでも。
function supportRow(f) {
  const mid = getMemberId();
  const mine = ALL_SUPPORTS.find(s => s.fight_id === f.id && s.member_id === mid);
  const c1 = ALL_SUPPORTS.filter(s => s.fight_id === f.id && s.fighter_id === f.fighter1_id).length;
  const c2 = ALL_SUPPORTS.filter(s => s.fight_id === f.id && s.fighter_id === f.fighter2_id).length;
  const f1 = FMAP[f.fighter1_id], f2 = FMAP[f.fighter2_id];
  const btn = (fid, name, cnt, cls) =>
    `<button class="sup-btn ${cls} ${mine?.fighter_id === fid ? "sel" : ""}"
      onclick="toggleSupport('${f.id}','${fid}')"
      style="flex:1;min-width:0;padding:6px 8px;border-radius:8px;border:1px solid #33333a;background:${mine?.fighter_id===fid?(cls==="c1"?"#3a1418":"#14213a"):"#161620"};color:#eee;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📣 ${esc(name)}${cnt ? ` <b style="color:#c9a84a">${cnt}</b>` : ""}</button>`;
  return `<div class="support-row" style="display:flex;gap:6px;align-items:center;margin-top:8px">
    <span style="font-size:11px;color:#8a8a92;flex:none">応援</span>
    ${btn(f.fighter1_id, f1?.name, c1, "c1")}${btn(f.fighter2_id, f2?.name, c2, "c2")}
  </div>`;
}
async function toggleSupport(fightId, fighterId) {
  const mid = getMemberId();
  const cur = ALL_SUPPORTS.find(s => s.fight_id === fightId && s.member_id === mid);
  try {
    if (cur && cur.fighter_id === fighterId) await DB.deleteSupport(mid, fightId);
    else await DB.upsertSupport({ member_id: mid, fight_id: fightId, fighter_id: fighterId });
    ALL_SUPPORTS = await DB.listSupports({ fightIds: FIGHTS.map(f => f.id) });
    replaceCard(fightId);
    toast("📣 応援を更新した");
  } catch (e) { toast("応援テーブルが未作成かも（要SQL）"); }
}

function fightLabel(f) {
  const no = f.segment === "opening" ? `OPENING 第${f.order_no}試合` : `第${f.order_no}試合`;
  return `<span class="fno">${no}</span>
    ${f.title_label ? `<span class="title-label">${esc(f.title_label)}</span>` : ""}
    <span>${esc(f.weight_class || "")}</span>
    ${f.no_score ? `<span class="ns-badge">⚠️ ${esc(f.no_score_note || "体重超過")}｜予想対象外</span>` : ""}`;
}

// 選手名から名鑑へ飛ぶリンク行
function profileLinks(f) {
  const f1 = FMAP[f.fighter1_id], f2 = FMAP[f.fighter2_id];
  return `
    <div class="profile-links">
      <a href="fighter.html?id=${f.fighter1_id}">${esc(f1?.name)} の名鑑 ›</a>
      <a href="fighter.html?id=${f.fighter2_id}">${esc(f2?.name)} の名鑑 ›</a>
    </div>`;
}

// ---------- 予想UI（受付中） ----------
// 保存済み＆編集中でなければ「確定ビュー」、それ以外は「選択ビュー（決定ボタン付き）」
function predictCard(f) {
  const saved = myPreds[f.id];
  if (saved && !editing.has(f.id)) return confirmedCard(f, saved);
  const p = drafts[f.id] || (saved ? { ...saved } : {});
  const f1 = FMAP[f.fighter1_id], f2 = FMAP[f.fighter2_id];
  // 決まり手＝「判定」or 具体的な決定打を1つ選ぶ（当てれば“ピタリ”）。任意。
  const curKim = p.method === "DEC" ? "DEC" : (p.technique || "");
  const kimSelect = p.winner_id ? `
    <div class="chips">
      <span class="clabel">決まり手 — 当てれば“ピタリ”（任意）</span>
      <select class="tech-select" onchange="setKimarite('${f.id}',this.value)">
        <option value="">— 狙わない（的中のみ）—</option>
        <option value="DEC" ${curKim === "DEC" ? "selected" : ""}>判定</option>
        <optgroup label="KO/TKO">
          ${techsFor("KO").map(t => `<option value="${t.id}" ${curKim === t.id ? "selected" : ""}>${t.label}</option>`).join("")}
        </optgroup>
        <optgroup label="一本">
          ${techsFor("SUB").map(t => `<option value="${t.id}" ${curKim === t.id ? "selected" : ""}>${t.label}</option>`).join("")}
        </optgroup>
      </select>
    </div>` : "";
  // KO/一本を選んだ時だけラウンド選択（ピタリ＝決まり手＋ラウンド）。判定はラウンド無し。
  const roundChips = (p.winner_id && p.method && p.method !== "DEC") ? `
    <div class="chips">
      <span class="clabel">ラウンド — 決まり手とラウンド両方一致で“ピタリ”</span>
      ${Array.from({ length: f.rounds || 3 }, (_, i) => i + 1).map(r =>
        `<button class="chip ${Number(p.round) === r ? "sel" : ""}" onclick="setDraft('${f.id}','round',${r})">${r}R</button>`).join("")}
    </div>` : "";
  return `
    <div class="fight-card" id="fc_${f.id}">
      ${f.image_url ? `<div class="banner"><img src="${esc(f.image_url)}" alt="" loading="lazy"></div>` : ""}
      ${voteBar(f)}
      <div class="fight-label">${fightLabel(f)}</div>
      <div class="vs-row">
        <button class="corner-btn c1 ${p.winner_id === f.fighter1_id ? "sel" : ""}"
          onclick="setDraft('${f.id}','winner_id','${f.fighter1_id}')"><small>RED</small>${esc(f1?.name)}</button>
        <span class="vs-mark">VS</span>
        <button class="corner-btn c2 ${p.winner_id === f.fighter2_id ? "sel" : ""}"
          onclick="setDraft('${f.id}','winner_id','${f.fighter2_id}')"><small>BLUE</small>${esc(f2?.name)}</button>
      </div>
      ${profileLinks(f)}
      ${supportRow(f)}
      ${kimSelect}${roundChips}
      <div class="confirm-bar">
        <button class="btn decide" ${p.winner_id ? "" : "disabled"} onclick="confirmPred('${f.id}')">この予想で決定</button>
        ${saved ? `<button class="btn ghost" onclick="cancelEdit('${f.id}')">キャンセル</button>` : ""}
      </div>
    </div>`;
}

// 確定ビュー：自分の予想サマリー＋編集／取り消し
function confirmedCard(f, p) {
  const f1 = FMAP[f.fighter1_id], f2 = FMAP[f.fighter2_id];
  const kim = p.method === "DEC" ? "判定" : (p.technique ? TECH_LABEL[p.technique] : null);
  const detail = [kim, (p.method !== "DEC" && p.round) ? `${p.round}R` : null].filter(Boolean).join("・");
  const tier = kim ? "ピタリ狙い" : "的中狙い";
  return `
    <div class="fight-card confirmed" id="fc_${f.id}">
      ${f.image_url ? `<div class="banner"><img src="${esc(f.image_url)}" alt="" loading="lazy"></div>` : ""}
      ${voteBar(f)}
      <div class="fight-label">${fightLabel(f)}</div>
      <div class="vs-row">
        <div class="corner-btn c1 ${p.winner_id === f.fighter1_id ? "sel" : ""}"><small>RED</small>${esc(f1?.name)}</div>
        <span class="vs-mark">VS</span>
        <div class="corner-btn c2 ${p.winner_id === f.fighter2_id ? "sel" : ""}"><small>BLUE</small>${esc(f2?.name)}</div>
      </div>
      ${profileLinks(f)}
      ${supportRow(f)}
      <div class="my-pick">
        <span class="mp-check">✓</span>
        <span class="mp-body"><b>${esc(FMAP[p.winner_id]?.name)}</b>${detail ? `　${esc(detail)}` : ""}
          <span class="mp-max">${tier}</span></span>
      </div>
      <div class="confirm-bar">
        <button class="btn ghost" onclick="startEdit('${f.id}')">編集</button>
        <button class="clear-btn" onclick="clearPred('${f.id}')">予想を取り消す</button>
      </div>
    </div>`;
}

// ---------- 受付前（計量待ち）：カードだけ見せる ----------
function previewCard(f) {
  const f1 = FMAP[f.fighter1_id], f2 = FMAP[f.fighter2_id];
  return `
    <div class="fight-card" id="fc_${f.id}">
      ${f.image_url ? `<div class="banner"><img src="${esc(f.image_url)}" alt="" loading="lazy"></div>` : ""}
      ${voteBar(f)}
      <div class="fight-label">${fightLabel(f)}</div>
      <div class="vs-row">
        <div class="corner-btn c1 disabled"><small>RED</small>${esc(f1?.name)}</div>
        <span class="vs-mark">VS</span>
        <div class="corner-btn c2 disabled"><small>BLUE</small>${esc(f2?.name)}</div>
      </div>
      ${profileLinks(f)}
      ${supportRow(f)}
      <div class="fight-foot"><span class="save-note">計量終了後に予想開始</span></div>
    </div>`;
}

// ---------- 中止・延期の試合 ----------
// カードに大きくCANCELLEDを重ね、理由を添える。予想は採点外だが一応見れる。
function cancelledCard(f) {
  const f1 = FMAP[f.fighter1_id], f2 = FMAP[f.fighter2_id];
  const picks = allPreds.filter(p => p.fight_id === f.id).length;
  return `
    <div class="fight-card cancelled" id="fc_${f.id}">
      <div class="cancel-stamp">CANCELLED</div>
      ${f.image_url ? `<div class="banner"><img src="${esc(f.image_url)}" alt="" loading="lazy"></div>` : ""}
      ${voteBar(f)}
      <div class="fight-label">${fightLabel(f)}</div>
      <div class="vs-row">
        <div class="corner-btn c1 disabled"><small>RED</small>${esc(f1?.name)}</div>
        <span class="vs-mark">VS</span>
        <div class="corner-btn c2 disabled"><small>BLUE</small>${esc(f2?.name)}</div>
      </div>
      <div class="cancel-note">${esc(f.cancel_note || "この試合は中止・延期になりました")}</div>
      ${picks ? `<div class="ob-picks" id="op_${f.id}">
        <div class="ob-head">この試合の予想（採点対象外）</div>
        ${picksRows(f)}
      </div>` : ""}
    </div>`;
}

// 選択はローカルに貯めるだけ。「決定」で初めて保存される
function setDraft(fightId, key, val) {
  const base = drafts[fightId] || (myPreds[fightId] ? { ...myPreds[fightId] } : {});
  const next = { ...base, member_id: getMemberId(), fight_id: fightId };
  if (key === "winner_id") {
    if (next.winner_id === val) return;
    next.winner_id = val;
  } else if (next[key] === val) {
    next[key] = null; // 同じチップ再タップで解除
    if (key === "method") { next.round = null; next.technique = null; }
  } else {
    next[key] = val || null;
    if (key === "method") { next.round = null; next.technique = null; }
  }
  drafts[fightId] = next;
  replaceCard(fightId);
}

// 決まり手ピッカー：判定 or 決定打(technique)を1つ。method を自動で決める。ラウンドは廃止。
function setKimarite(fightId, val) {
  const base = drafts[fightId] || (myPreds[fightId] ? { ...myPreds[fightId] } : {});
  const next = { ...base, member_id: getMemberId(), fight_id: fightId };
  if (!val) { next.method = null; next.technique = null; }
  else if (val === "DEC") { next.method = "DEC"; next.technique = null; }
  else { const t = TECHNIQUES.find(x => x.id === val); next.method = t ? t.method : null; next.technique = val; }
  next.round = null;
  drafts[fightId] = next;
  replaceCard(fightId);
}

async function confirmPred(fightId) {
  const p = drafts[fightId] || myPreds[fightId];
  if (!p || !p.winner_id) return;
  try {
    await DB.upsertPrediction({
      member_id: getMemberId(), fight_id: fightId,
      winner_id: p.winner_id, method: p.method || null,
      round: p.round || null, technique: p.technique || null,
    });
    myPreds[fightId] = { ...p, member_id: getMemberId(), fight_id: fightId };
    delete drafts[fightId];
    editing.delete(fightId);
    replaceCard(fightId);
    await refreshMatrix();
    toast("予想を決定した ✓");
  } catch (e) { toast(e.message || "保存できなかった"); }
}

function startEdit(fightId) {
  editing.add(fightId);
  drafts[fightId] = { ...myPreds[fightId] };
  replaceCard(fightId);
}

function cancelEdit(fightId) {
  editing.delete(fightId);
  delete drafts[fightId];
  replaceCard(fightId);
}

async function clearPred(fightId) {
  await DB.deletePrediction(getMemberId(), fightId);
  delete myPreds[fightId];
  delete drafts[fightId];
  editing.delete(fightId);
  replaceCard(fightId);
  await refreshMatrix();
  toast("取り消した");
}

// オープンブック（締切なし）時、保存後にALL PICKS一覧と各カードの併記を即時更新
async function refreshMatrix() {
  if (PHASE === "before_open") return;
  allPreds = await DB.listPredictions({ fightIds: FIGHTS.map(f => f.id) });
  const box = document.getElementById("matrix-section");
  if (box) box.innerHTML = allPicksMatrix();
  // 各カード下の「みんなの予想」も貼り直す（自分のピックが増減し、一致/割れも変わるため）
  // 中止試合のブロックは専用カード側で描画済みなので触らない。
  FIGHTS.forEach(f => {
    if (f.cancelled) return;
    const el = document.getElementById("op_" + f.id);
    if (el) el.outerHTML = othersBlock(f);
  });
}

function replaceCard(fightId) {
  const f = FIGHTS.find(x => x.id === fightId);
  const el = document.getElementById("fc_" + fightId);
  const tmp = document.createElement("div");
  tmp.innerHTML = (PHASE === "locked" || PHASE === "finished") ? resultCard(f)
    : PHASE === "before_open" ? previewCard(f) : predictCard(f);
  el.replaceWith(tmp.firstElementChild);
}

// ---------- 答え合わせUI（締切後） ----------
function resultCard(f) {
  const f1 = FMAP[f.fighter1_id], f2 = FMAP[f.fighter2_id];
  const decided = f.winner_id && f.result_method && !f.no_score;
  let resultBox = `<div class="result-box waiting"><span class="rline">結果待ち</span></div>`;
  if (f.no_score) {
    const w = FMAP[f.winner_id];
    const res = (f.winner_id && f.result_method)
      ? `<div class="rline"><span class="win">🏆 ${esc(w?.name)}</span>　${METHOD_LABEL[f.result_method] || ""}${f.result_method !== "DEC" && f.result_round ? ` ${f.result_round}R` : ""}${f.result_technique ? `／${TECH_LABEL[f.result_technique] || esc(f.result_technique)}` : ""}</div>`
      : "";
    resultBox = `<div class="result-box">${res}<span class="rline" style="color:#ffcf66">⚠️ ${esc(f.no_score_note || "体重超過")}（予想対象外・集計に含めない）</span></div>`;
  } else if (decided) {
    if (f.result_method === "DRAW" || f.result_method === "NC") {
      resultBox = `<div class="result-box"><span class="rline">${METHOD_LABEL[f.result_method]}</span>（集計対象外）</div>`;
    } else {
      const w = FMAP[f.winner_id];
      resultBox = `<div class="result-box">
        <div class="rline"><span class="win">🏆 ${esc(w?.name)}</span>　${METHOD_LABEL[f.result_method] || ""}
          ${f.result_method !== "DEC" && f.result_round ? ` ${f.result_round}R` : ""}
          ${f.result_technique ? `／${TECH_LABEL[f.result_technique] || esc(f.result_technique)}` : ""}</div>
      </div>`;
    }
  }
  return `
    <div class="fight-card" id="fc_${f.id}">
      ${f.image_url ? `<div class="banner"><img src="${esc(f.image_url)}" alt="" loading="lazy"></div>` : ""}
      ${voteBar(f)}
      <div class="fight-label">${fightLabel(f)}</div>
      <div class="vs-row">
        <div class="corner-btn c1 ${decided && f.winner_id === f.fighter1_id ? "sel" : ""}"><small>RED</small>${esc(f1?.name)}</div>
        <span class="vs-mark">VS</span>
        <div class="corner-btn c2 ${decided && f.winner_id === f.fighter2_id ? "sel" : ""}"><small>BLUE</small>${esc(f2?.name)}</div>
      </div>
      ${profileLinks(f)}
      ${supportRow(f)}
      ${resultBox}
      ${picksRows(f)}
    </div>`;
}

// 1試合分の「全員の予想」行。結果が出ていれば○×・ピタリ・あらますを付ける。
// 答え合わせカード（締切後）とオープンブックの各カード下の両方で使う。
function picksRows(f) {
  const decided = f.winner_id && f.result_method && !f.no_score && !["DRAW", "NC"].includes(f.result_method);
  const preds = allPreds.filter(p => p.fight_id === f.id)
    .map(p => ({ p, m: MEMBERS.find(m => m.id === p.member_id), s: decided ? scoreFight(p, f) : null }))
    // 3人を最上部に固定 → その中/外で見せ場順（あらます>ピタリ>的中）
    .sort((a, b) => friendRank(a.p.member_id) - friendRank(b.p.member_id) || predRank(b.s) - predRank(a.s));
  if (!preds.length) return `<div class="pred-row"><span class="pdetail">まだ予想なし</span></div>`;
  return preds.map(({ p, m, s }) => {
    const kim = p.method === "DEC" ? "判定" : (p.technique ? TECH_LABEL[p.technique] : null);
    const detail = [FMAP[p.winner_id]?.name, kim, (p.method !== "DEC" && p.round) ? `${p.round}R` : null].filter(Boolean).join("・");
    if (!s || !s.counted) return `<div class="pred-row"><span class="pwho">${esc(m?.name)}</span><span class="pdetail">${esc(detail)}</span></div>`;
    const tier = s.pitari ? `<span class="ptier pitari">ピタリ!</span>`
      : s.winnerHit ? `<span class="ptier">的中</span>` : "";
    return `<div class="pred-row ${s.winnerHit ? "hit" : "miss"}">
      <span class="hitmark">${s.winnerHit ? "○" : "×"}</span>
      <span class="pwho">${esc(m?.name)}</span>
      <span class="pdetail">${esc(detail)}</span>
      ${tier}
    </div>`;
  }).join("");
}

// その試合で「全員の勝者予想が揃っているか」を判定する。
//   unanimous＝予想した全員が同じ勝者／split＝割れている／none＝1人以下
function consensus(f) {
  const picks = allPreds.filter(p => p.fight_id === f.id);
  if (picks.length < 2) return { level: "none", n: picks.length };
  const winners = new Set(picks.map(p => p.winner_id));
  return winners.size === 1
    ? { level: "unanimous", winner: [...winners][0], n: picks.length }
    : { level: "split", n: picks.length };
}

// 得票率の横グラフ（オッズ可視化）。赤=RED側・青=BLUE側の勝者予想の割合。
function voteBar(f) {
  const picks = allPreds.filter(p => p.fight_id === f.id);
  const n = picks.length;
  if (!n) return "";
  const f1 = FMAP[f.fighter1_id], f2 = FMAP[f.fighter2_id];
  const n1 = picks.filter(p => p.winner_id === f.fighter1_id).length;
  const p1 = Math.round(n1 / n * 100), p2 = 100 - p1;
  return `
    <div class="votebar" style="margin:8px 0 4px">
      <div style="display:flex;height:22px;border-radius:5px;overflow:hidden;font:700 12px/22px 'Noto Sans JP',sans-serif;color:#fff">
        <div style="width:${p1}%;background:#e60012;padding:0 6px;white-space:nowrap;overflow:hidden">${p1 >= 12 ? p1 + "%" : ""}</div>
        <div style="width:${p2}%;background:#1e6fd9;text-align:right;padding:0 6px;white-space:nowrap;overflow:hidden">${p2 >= 12 ? p2 + "%" : ""}</div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#888;margin-top:3px">
        <span>${esc(f1?.name)} ${p1}%</span><span>${p2}% ${esc(f2?.name)}</span>
      </div>
    </div>`;
}

// 各カードの下に出す「みんなの予想」ブロック。得票率グラフで割れ具合は一目なので文言バッジは出さない。
function othersBlock(f) {
  return `<div class="ob-picks" id="op_${f.id}">
    <div class="ob-head">みんなの予想</div>
    ${picksRows(f)}
  </div>`;
}

// ---------- 全員の予想マトリクス（締切後） ----------
function allPicksMatrix() {
  const activeMembers = orderMembers(MEMBERS.filter(m => allPreds.some(p => p.member_id === m.id)));
  if (!activeMembers.length) return "";
  const ordered = FIGHTS;  // renderと同じ並び（メイン降順→オープニング降順）
  const rows = ordered.map(f => {
    // 行頭はカード写真（適度な大きさ）＋得票率ミニ棒グラフ。番号（第X）は出さない。
    const thumb = f.image_url
      ? `<img class="mx-thumb" src="${esc(f.image_url)}" alt="" loading="lazy"
           style="width:112px;height:auto;display:block;border-radius:4px">`
      : "";
    const mp = allPreds.filter(p => p.fight_id === f.id);
    const mn1 = mp.filter(p => p.winner_id === f.fighter1_id).length;
    const mpr1 = mp.length ? Math.round(mn1 / mp.length * 100) : 0, mpr2 = 100 - mpr1;
    const miniBar = mp.length ? `
      <div style="display:flex;height:7px;border-radius:3px;overflow:hidden;margin-top:4px">
        <div style="width:${mpr1}%;background:#e60012"></div><div style="width:${mpr2}%;background:#1e6fd9"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:#999;margin-top:1px"><span>${mpr1}%</span><span>${mpr2}%</span></div>` : "";
    // 応援📣もALL PICKSに出す（予想とは別軸・どちらを応援したか）
    const sc1 = ALL_SUPPORTS.filter(s => s.fight_id === f.id && s.fighter_id === f.fighter1_id).length;
    const sc2 = ALL_SUPPORTS.filter(s => s.fight_id === f.id && s.fighter_id === f.fighter2_id).length;
    const supBadge = (sc1 || sc2)
      ? `<div style="font-size:9px;color:#c9a84a;font-weight:700;margin-top:2px">📣 <span style="color:#ff5a67">${sc1}</span> - <span style="color:#5aa0ff">${sc2}</span></div>` : "";
    const decided = f.winner_id && f.result_method && !f.no_score && !["DRAW", "NC"].includes(f.result_method);
    const cells = activeMembers.map(m => {
      const p = allPreds.find(x => x.fight_id === f.id && x.member_id === m.id);
      const sup = ALL_SUPPORTS.find(s => s.fight_id === f.id && s.member_id === m.id);
      const supNm = sup ? esc((FMAP[sup.fighter_id]?.name || "").replace(/[ 　].*$/, "").slice(0, 5)) : "";
      const supMk = sup ? `<span class="mx-sup ${sup.fighter_id === f.fighter1_id ? "r" : "b"}">📣${supNm}</span>` : "";
      if (!p) return `<td class="mx-cell none">${supMk || "—"}</td>`;
      const corner = p.winner_id === f.fighter1_id ? "c1" : "c2";
      const hitCls = decided ? (p.winner_id === f.winner_id ? " hit" : " miss") : "";
      const sub = p.method === "DEC" ? "判定"
        : [p.technique ? techShort(p.technique) : "", p.round ? `${p.round}R` : ""].filter(Boolean).join(" ");
      const s = decided ? scoreFight(p, f) : null;
      const mark = s?.pitari ? " ピタリ" : "";
      return `<td class="mx-cell ${corner}${hitCls}">
        <span class="mx-name">${esc(FMAP[p.winner_id]?.name || "")}</span>
        ${sub || mark ? `<span class="mx-sub">${esc(sub)}${mark}</span>` : ""}
        ${supMk}
      </td>`;
    }).join("");
    if (f.cancelled) {  // 中止試合：番号に×を付け、行をグレーアウト（ピックは残す）
      return `<tr class="mxrow cancelled"><th class="mx-fight">${thumb}<span class="mx-x">中止</span></th>${cells}</tr>`;
    }
    if (f.no_score) {  // 体重超過：試合はやるが予想対象外。琥珀タグ＋ピックは残す
      return `<tr class="mxrow noscore"><th class="mx-fight">${thumb}<span class="mx-x ns">体重超過｜対象外</span></th>${cells}</tr>`;
    }
    const c = decided ? { level: "" } : consensus(f);  // 結果が出たら○×優先、未確定なら一致/割れ
    return `<tr class="mxrow ${c.level}"><th class="mx-fight">${thumb}${miniBar}${supBadge}</th>${cells}</tr>`;
  }).join("");
  return `
    <div class="section-label">ALL PICKS</div>
    <div class="matrix-wrap">
      <table class="matrix">
        <tr><th></th>${activeMembers.map(m => `<th class="mx-member"><a href="picks.html?event=${EV.id}&member=${m.id}" style="color:inherit;text-decoration:none;display:block">${esc(m.name)}<span style="display:block;font-size:9px;color:#c9a84a;font-weight:700;margin-top:1px">▶ 予想カード</span></a></th>`).join("")}</tr>
        ${rows}
      </table>
    </div>
    <p class="page-sub" style="margin-top:6px">赤＝RED側・青＝BLUE側の予想。結果が出ると○×で色分け。</p>`;
}

// ---------- 結果発表（finished時の大会サマリー） ----------
function eventSummary() {
  const rows = computeLeaderboard(MEMBERS, FIGHTS, allPreds).filter(r => r.answered > 0);
  if (!rows.length) return "";
  return `
    <div class="summary-box">
      <div class="en-label gold">FINAL RESULT</div>
      <div class="summary-title">この大会の成績</div>
      ${rows.map((r, i) => `
        <div class="summary-row ${i === 0 ? "champ" : ""}">
          <span class="srank">${i + 1}</span>
          <span class="sname">${esc(r.member.name)}${i === 0 ? "　👑" : ""}</span>
          <span class="srate">${fmtRate(r.rate)}</span>
          <span class="ssub">${r.hits}/${r.decided}的中${r.pitari ? `・ピタリ${r.pitari}` : ""}</span>
        </div>`).join("")}
    </div>`;
}

function render() {
  const main = FIGHTS.filter(f => f.segment === "main");
  const op = FIGHTS.filter(f => f.segment === "opening");
  const base = (PHASE === "locked" || PHASE === "finished") ? resultCard
    : PHASE === "before_open" ? previewCard : predictCard;
  // 予想受付中は、大会の締切有無に関わらず各カードの下に全員のピックを併記する
  // （Gaku方針：みんなの予想は常時公開）。締切後・結果発表後は resultCard が
  // 既に全員のピックを内包しているので、二重にしないため predictCard のときだけ足す。
  // 中止・延期の試合は専用カード（大きくCANCELLED・予想は見れる）に差し替える。
  const card = (f) => f.cancelled ? cancelledCard(f)
    : base === predictCard ? base(f) + othersBlock(f) : base(f);
  const days = daysToEvent(EV);
  const openBook = isOpenBook(EV);
  const subText = openBook ? "締切なし・いつでも予想＆編集OK。みんなの予想も公開中。"
    : {
      before_open: "カード公開中。計量終了後に予想が開く。",
      open: "受付中。みんなの予想は最初から公開——見ながら予想できる。",
      locked: "締切済み。全員の予想を公開中——あとは試合を待つだけ。",
      finished: "結果確定・答え合わせ",
    }[PHASE];
  document.getElementById("main").innerHTML = `
    <div class="en-label">${PHASE === "finished" ? "RESULT" : "FIGHT CARD"}</div>
    <h1 class="page-title">${esc(EV.name)}</h1>
    <p class="page-sub">${fmtDate(EV.event_date)}　${subText}</p>
    ${PHASE === "finished" ? eventSummary() : ""}
    <div id="matrix-section">${PHASE !== "before_open" ? allPicksMatrix() : ""}</div>
    ${main.length ? `<div class="section-label">MAIN CARD</div>` : ""}
    ${main.map(card).join("")}
    ${op.length ? `<div class="section-label">OPENING FIGHTS</div>` : ""}
    ${op.map(card).join("")}`;
  // 締切ありの受付中のみカウントダウンをスティッキー表示（締切なし大会は非表示）
  const sc = document.getElementById("sticky-cd");
  if (PHASE === "open" && !openBook) {
    sc.innerHTML = `
      <div class="countdown-bar sticky">
        <div class="cd-left">
          <span class="cd-label">予想締切まで</span>
          <span class="cd-timer" id="cd_main">--:--:--</span>
        </div>
        ${days !== null && days >= 0 ? `<div class="cd-days"><b>${days === 0 ? "本日" : "あと" + days + "日"}</b><span>大会${days === 0 ? "開催" : "まで"}</span></div>` : ""}
      </div>`;
    startCountdown(document.getElementById("cd_main"), EV.lock_at, () => location.reload());
  } else sc.innerHTML = "";
}

load();
</script>
