<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>大会予想｜予想番付</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261107232210">
</head>
<body>
<div id="app-header"></div>
<div id="sticky-cd"></div>
<div class="wrap" id="main"></div>
<div class="toast" id="toast"></div>
<div class="wiz" id="wiz" hidden role="dialog" aria-modal="true" aria-label="勝敗予想"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=20261107232210"></script>
<script src="js/techniques.js?v=20261107232210"></script>
<script src="js/demo-data.js?v=20261107232210"></script>
<script src="js/api.js?v=20261107232210"></script>
<script src="js/app.js?v=20261107232210"></script>
<script src="js/bishoku_summary.js?v=20261107232210"></script>
<script>
let EV, PHASE, FIGHTS, FMAP, MEMBERS, myPreds = {}, allPreds = [], ALL_SUPPORTS = [];

// 美食会の3人（ハメ・抜き・丸山）は一覧では左・各カードでは最上部に固定する（Gaku方針）
const FRIEND_IDS = ["m_hame", "m_nuki", "m_maruyama"];
const friendRank = (id) => { const i = FRIEND_IDS.indexOf(id); return i < 0 ? 99 : i; };
// 3人を先頭（固定順）→ 残りは元の順。安定ソート。
const orderMembers = (list) => [...list].sort((a, b) => friendRank(a.id) - friendRank(b.id));
// 結果が出ている時の見せ場ランク（あらます>ピタリ>的中>その他）
const predRank = (s) => s ? (s.aramasu ? 3 : s.pitari ? 2 : s.winnerHit ? 1 : 0) : 0;

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove("show"), Math.max(1500, msg.length * 90));  // 長いエラー文は読める時間だけ出す
}

async function load() {
  if (!requireMember()) return;
  await renderHeader("home");
  const id = qp("id");
  EV = id ? await DB.getEvent(id) : null;
  if (!EV) { document.getElementById("main").innerHTML = "<p class='page-sub'>大会が見つかりません。</p>"; return; }
  PHASE = eventPhase(EV);
  FIGHTS = (await DB.listFights(EV.id)).sort((a, b) =>
    (a.segment === b.segment) ? b.order_no - a.order_no : (a.segment === "main" ? -1 : 1));
  FMAP = fighterMap(await DB.listFighters());
  MEMBERS = await DB.listMembers();
  const fightIds = FIGHTS.map(f => f.id);
  // みんなの予想は常時公開のため、受付中でも全員分を取得する（計量前は予想が無い）
  allPreds = PHASE === "before_open"
    ? []
    : await DB.listPredictions({ fightIds });
  myPreds = {};
  for (const p of allPreds.filter(p => p.member_id === getMemberId())) myPreds[p.fight_id] = p;
  // 応援（supportsテーブル未作成でもページを落とさない）
  try { ALL_SUPPORTS = PHASE === "before_open" ? [] : await DB.listSupports({ fightIds }); }
  catch (e) { ALL_SUPPORTS = []; }
  await window.AVATARS_READY;
  render();
}

// 📣応援：予想とは別に「どっちを応援するか」。締切に関係なくいつでも。
function supportRow(f) {
  const mid = getMemberId();
  const mine = ALL_SUPPORTS.find(s => s.fight_id === f.id && s.member_id === mid);
  const c1 = ALL_SUPPORTS.filter(s => s.fight_id === f.id && s.fighter_id === f.fighter1_id).length;
  const c2 = ALL_SUPPORTS.filter(s => s.fight_id === f.id && s.fighter_id === f.fighter2_id).length;
  const f1 = FMAP[f.fighter1_id], f2 = FMAP[f.fighter2_id];
  const btn = (fid, name, cnt, cls) =>
    `<button class="sup-btn ${cls} ${mine?.fighter_id === fid ? "sel" : ""}"
      onclick="toggleSupport('${f.id}','${fid}')"
      style="flex:1;min-width:0;padding:6px 8px;border-radius:8px;border:1px solid #33333a;background:${mine?.fighter_id===fid?(cls==="c1"?"#3a1418":"#14213a"):"#161620"};color:#eee;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📣 ${esc(name)}${cnt ? ` <b style="color:#c9a84a">${cnt}</b>` : ""}</button>`;
  return `<div class="support-row" style="display:flex;gap:6px;align-items:center;margin-top:8px">
    <span style="font-size:11px;color:#8a8a92;flex:none">応援</span>
    ${btn(f.fighter1_id, f1?.name, c1, "c1")}${btn(f.fighter2_id, f2?.name, c2, "c2")}
  </div>`;
}
async function toggleSupport(fightId, fighterId) {
  const mid = getMemberId();
  const cur = ALL_SUPPORTS.find(s => s.fight_id === fightId && s.member_id === mid);
  try {
    if (cur && cur.fighter_id === fighterId) await DB.deleteSupport(mid, fightId);
    else await DB.upsertSupport({ member_id: mid, fight_id: fightId, fighter_id: fighterId });
    ALL_SUPPORTS = await DB.listSupports({ fightIds: FIGHTS.map(f => f.id) });
    replaceCard(fightId);
    // 「みんなの予想」と全員の予想一覧にも応援が出るので貼り直す
    const op = document.getElementById("op_" + fightId);
    if (op) op.outerHTML = othersBlock(FIGHTS.find(x => x.id === fightId));
    drawBishokuSummary();
    toast("📣 応援を更新した");
  } catch (e) { toast("応援テーブルが未作成かも（要SQL）"); }
}

// 試合の見出し：1行（Gaku 11/7「2段になってる・文字ダサい」）。大きい番号 → 題（あれば赤）／階級 → 右端に体重
// 題に階級名が入っていれば（RIZINフライ級タイトルマッチ）階級も体重も繰り返さない（階級＝体重は決まっている・スマホで1行に収める）
function fightLabel(f) {
  const wc = f.weight_class ? weightClassName(f.weight_class) : "";
  const t = f.title_label
    ? `<span class="fl-t title-label">${esc(f.title_label)}</span>${wc && !f.title_label.includes(wc) ? `<span class="fl-t">${esc(wc)}</span>` : ""}`
    : wc ? `<span class="fl-t">${esc(wc)}</span>` : "";
  return `<span class="fno">${f.segment === "opening" ? "OP " : ""}第<b>${f.order_no}</b>試合</span>${t}
    ${f.weight_class && f.weight_class !== wc && !f.title_label?.includes(wc) ? `<span class="fl-kg">${esc(f.weight_class)}</span>` : ""}
    ${f.no_score ? `<span class="ns-badge">⚠️ ${esc(f.no_score_note || "体重超過")}｜予想対象外</span>` : ""}
    ${f.event_only ? `<span class="ns-badge">${esc(f.event_only_note || "MMA以外のルール")}｜予想は任意・通算対象外</span>` : ""}`;
}

// 選手名から名鑑へ飛ぶリンク行
function profileLinks(f) {
  const f1 = FMAP[f.fighter1_id], f2 = FMAP[f.fighter2_id];
  return `
    <div class="profile-links">
      <a href="fighter.html?id=${f.fighter1_id}">${esc(f1?.name)} の名鑑 ›</a>
      <a href="fighter.html?id=${f.fighter2_id}">${esc(f2?.name)} の名鑑 ›</a>
    </div>`;
}

// その場で判断できるように：戦績・勝ち方の割合・前戦（○×）。トグルで直近5試合（Gaku依頼11/7）
// 開閉はカードを描き直しても保つ（選手をタップするたびに閉じないように）
const statsOpen = new Set();
const RMARK = { W: ["○", "w"], L: ["×", "l"], D: ["△", "d"], NC: ["NC", "d"] };
const recentOf = (x) => [...(x?.history || [])].sort((a, b) => String(b.d).localeCompare(String(a.d)));
const resMark = (r) => { const [s, c] = RMARK[r] || ["?", "d"]; return `<span class="rm ${c}">${s}</span>`; };
const histRow = (r) => `<div class="st-row">${resMark(r.r)}<span class="st-body"><span class="st-opp">${esc(r.opp)}</span>
  <span class="st-how">${esc([r.how, r.d].filter(Boolean).join("・"))}</span></span></div>`;
// 細かい文字で読ませず形で見せる（Gaku指示11/7「シンプルな中に視認性を。ビジュアルで誘導」「色多い・情報は少なく」）：
// 勝敗数は大きな数字／勝ち方は戦績の横の空きに1本のバー（KO・一本・判定の割合）。色は使わず白〜灰の濃淡だけ
// 予想の入力は下の「勝敗予想」に分けたので、ここで選手名も持つ（判断材料はここだけで読める）
// 左右の段（名前・戦績・バー・前戦）は subgrid で高さをそろえる。片側にデータが無くても空の段を置いて行数を合わせる
// バーは左右で必ず同じ置き方（広い時は戦績の横・狭い時は戦績の下）＝左右の高さがずれない（Gaku指摘11/7「平行になってない」）
function wayBar(x) {
  if (x?.rec_ko == null || !x.rec_w) return "";
  const ws = [["KO", x.rec_ko, "sb-k"], ["一本", x.rec_sub ?? 0, "sb-s"], ["判定", x.rec_dec ?? 0, "sb-d"]];
  // 母数は勝ち数（反則勝ち等の「その他」はバーの空きとして残る）。内訳の合計が勝ち数を超える古いデータでもはみ出さない
  const base = Math.max(x.rec_w, ws.reduce((a, w) => a + w[1], 0));
  return `<div class="st-bar">
    <div class="sb-track">${ws.map(([, n, c]) => { const pc = n / base * 100;
      // 割合はバーの中。狭くて字が入らない区切り（18%未満）は数字を出さない＝長さで読む
      return n ? `<i class="${c}" style="width:${pc.toFixed(1)}%">${pc >= 18 ? `${Math.round(pc)}%` : ""}</i>` : ""; }).join("")}</div>
    <div class="sb-lab">${ws.map(([l, n, c]) => `<span class="${c}${n ? "" : " zero"}">${l}<b>${n}</b></span>`).join("")}</div>
  </div>`;
}
function statsSide(x, cls) {
  const h = recentOf(x);
  const age = ageText(x?.birth_date).replace(/（.*$/, "");   // 「31歳」だけ（生年月日は名鑑で）
  const num = (n, u, c) => `<span class="st-n ${c}"><b>${n}</b>${u}</span>`;
  const rec = x?.rec_w != null
    ? num(x.rec_w, "勝", "w") + num(x.rec_l ?? 0, "敗", "l")
      + (x.rec_d || x.rec_nc ? `<span class="st-n d">${x.rec_d ? `<b>${x.rec_d}</b>分` : ""}${x.rec_nc ? `<b>${x.rec_nc}</b>NC` : ""}</span>` : "")
    : `<span class="st-n d">戦績なし</span>`;
  return `<div class="st-side ${cls}">
    <div class="st-head"><span class="st-name">${fnm(x?.name || "")}</span>${age ? `<span class="st-age">${age}</span>` : ""}${x?.nickname ? `<span class="st-nick" title="${esc(x.nickname)}">“${esc(x.nickname)}”</span>` : ""}</div>
    <div class="st-recn">${rec}</div>
    ${wayBar(x) || `<div class="st-bar"></div>`}
    <div class="st-k">前戦</div>
    ${h[0] ? histRow(h[0]) : `<div class="st-row"><span class="st-how">データなし</span></div>`}
  </div>`;
}
function statsBlock(f) {
  const f1 = FMAP[f.fighter1_id], f2 = FMAP[f.fighter2_id];
  const n = Math.min(5, Math.max(recentOf(f1).length, recentOf(f2).length));
  const list = (x, cls) => { const rows = recentOf(x).slice(0, 5).map(histRow);
    while (rows.length < n) rows.push("<div></div>");
    return `<div class="st-side ${cls}">${rows.join("")}</div>`; };
  return `<div class="stats">
    <div class="st-cols" style="--rows:5">${statsSide(f1, "c1")}${statsSide(f2, "c2")}</div>
    ${n > 1 ? `<details class="st-more" ${statsOpen.has(f.id) ? "open" : ""} ontoggle="statsOpen[this.open ? 'add' : 'delete']('${f.id}')">
      <summary>直近5試合</summary>
      <div class="st-cols" style="--rows:${n}">${list(f1, "c1")}${list(f2, "c2")}</div>
    </details>` : ""}
  </div>`;
}

// ---------- 予想UI（受付中） ----------
// 勝敗は、カードの札を押してもその試合から予想の画面（openWiz）が開き、最後の「これでいい？」で決定して保存する（Gaku 11/7）。
// 決まり手・ラウンドは勝敗を保存した後にカードで入れる任意の追加入力で、選んだ時点で保存される
// 勝敗予想の札（Gaku 11/7「勝敗予想のタップ部分はこだわりたい。気持ちが昂る瞬間」）：うっすら赤・青の地に選手の顔を透かす。
// 選んだ方（締切後は勝った方）は金で囲み、顔がはっきり出る。選ばなかった方は沈む。予想・締切後・計量前・中止の全カードで同じ札
function cornerBox(f, side, { sel = false, tag = "div", attrs = "", cls = "" } = {}) {
  const fx = FMAP[side === 1 ? f.fighter1_id : f.fighter2_id];
  // CSS変数に入れた url() は style.css（css/）からの相対で読まれる＝絶対URLにして渡す
  const face = fx?.highlight_url ? ` style="--face:url('${esc(new URL(fx.highlight_url, location.href).href)}')"` : "";
  return `<${tag} class="corner-btn c${side}${sel ? " sel" : ""}${face ? " has-face" : ""}${cls ? " " + cls : ""}"${face}${attrs}>` +
    `<small>${side === 1 ? "RED" : "BLUE"}</small><span class="cb-name">${fnm(fx?.name)}</span></${tag}>`;
}
function predictCard(f) {
  const p = myPreds[f.id] || {};
  const curKim = p.method === "DEC" ? "DEC" : (p.technique || "");
  const corner = (side) => {
    const fid = side === 1 ? f.fighter1_id : f.fighter2_id, sel = p.winner_id === fid;
    return cornerBox(f, side, { sel, tag: "button", attrs: ` onclick="openWiz('${f.id}')"` });
  };
  // KO/一本を選んだ時だけラウンド（ピタリ＝決まり手＋ラウンド）。判定はラウンド無し
  // 決定後の欄は字が散って気が散る（Gaku指摘11/7）＝左揃えの1列にまとめ、見出し「決まり手／ラウンド」＋説明は最後に1行だけ
  const roundChips = (p.method && p.method !== "DEC") ? `
          <span class="pt-k">ラウンド</span>
          <div class="pt-v">${Array.from({ length: f.rounds || 3 }, (_, i) => i + 1).map(r =>
            `<button class="chip ${Number(p.round) === r ? "sel" : ""}" onclick="setRound('${f.id}',${r})">${r}R</button>`).join("")}</div>` : "";
  // 勝敗を選んだら、その下は決まり手の1段だけ（Gaku 11/7「ここら辺ごちゃついてる」）。
  // 「〇〇の勝ちで決定」は金の札がもう見せているので文で言い直さない。ピタリの見出し・開閉・説明文も持たない
  const pitari = p.winner_id ? `
      <div class="pt-grid">
        <span class="pt-k">決まり手</span>
        <div class="pt-v"><select class="tech-select" onchange="setKimarite('${f.id}',this.value)">
          <option value="">— 予想しない —</option>
          <option value="DEC" ${curKim === "DEC" ? "selected" : ""}>判定</option>
          <optgroup label="KO/TKO">
            ${techsFor("KO").map(t => `<option value="${t.id}" ${curKim === t.id ? "selected" : ""}>${t.label}</option>`).join("")}
          </optgroup>
          <optgroup label="一本">
            ${techsFor("SUB").map(t => `<option value="${t.id}" ${curKim === t.id ? "selected" : ""}>${t.label}</option>`).join("")}
          </optgroup>
        </select></div>${roundChips}
      </div>
      <div class="pt-foot"><button class="clear-btn" onclick="clearPred('${f.id}')">予想を取り消す</button></div>` : "";
  return `
    <div class="fight-card${p.winner_id ? " confirmed" : ""}" id="fc_${f.id}">
      ${f.image_url ? `<div class="banner"><img src="${esc(f.image_url)}" alt="" loading="lazy"></div>` : ""}
      ${voteBar(f)}
      <div class="fight-label">${fightLabel(f)}</div>
      ${statsBlock(f)}
      ${profileLinks(f)}
      <div class="pick-zone">
      <div class="pz-head">勝敗予想</div>
      <div class="vs-row${p.winner_id ? " has-sel" : ""}">
        ${corner(1)}
        <span class="vs-mark">VS</span>
        ${corner(2)}
      </div>
      ${p.winner_id ? "" : `<div class="win-hint">勝つと思う方をタップ！<br>ランキングは<b>勝敗予想だけ</b>で決まります。</div>`}
      ${pitari}
      ${supportRow(f)}
      </div>
    </div>`;
}

// ---------- 受付前（計量待ち）：カードだけ見せる ----------
function previewCard(f) {
  const f1 = FMAP[f.fighter1_id], f2 = FMAP[f.fighter2_id];
  return `
    <div class="fight-card" id="fc_${f.id}">
      ${f.image_url ? `<div class="banner"><img src="${esc(f.image_url)}" alt="" loading="lazy"></div>` : ""}
      ${voteBar(f)}
      <div class="fight-label">${fightLabel(f)}</div>
      ${statsBlock(f)}
      ${profileLinks(f)}
      <div class="pick-zone">
      <div class="pz-head">勝敗予想</div>
      <div class="vs-row">
        ${cornerBox(f, 1, { cls: "disabled" })}
        <span class="vs-mark">VS</span>
        ${cornerBox(f, 2, { cls: "disabled" })}
      </div>
      <div class="fight-foot"><span class="save-note">計量終了後に予想開始</span></div>
      ${supportRow(f)}
      </div>
    </div>`;
}

// ---------- 中止・延期の試合 ----------
// カードに大きくCANCELLEDを重ね、理由を添える。予想は採点外だが一応見れる。
function cancelledCard(f) {
  const f1 = FMAP[f.fighter1_id], f2 = FMAP[f.fighter2_id];
  const picks = allPreds.filter(p => p.fight_id === f.id).length;
  return `
    <div class="fight-card cancelled" id="fc_${f.id}">
      <div class="cancel-stamp">CANCELLED</div>
      ${f.image_url ? `<div class="banner"><img src="${esc(f.image_url)}" alt="" loading="lazy"></div>` : ""}
      ${voteBar(f)}
      <div class="fight-label">${fightLabel(f)}</div>
      <div class="vs-row">
        ${cornerBox(f, 1, { cls: "disabled" })}
        <span class="vs-mark">VS</span>
        ${cornerBox(f, 2, { cls: "disabled" })}
      </div>
      <div class="cancel-note">${esc(f.cancel_note || "この試合は中止・延期になりました")}</div>
      ${picks ? `<div class="ob-picks" id="op_${f.id}">
        <div class="ob-head">この試合の予想（採点対象外）</div>
        ${picksRows(f)}
      </div>` : ""}
    </div>`;
}

// 予想の保存。押した瞬間に画面を変え（待たせない）、裏で保存する。失敗したら元に戻して知らせる。
// 同じ試合の保存は順番に流す（素早く押し直しても、最後に押した方が残る）
const saveChain = {};
function savePred(fightId, patch, msg) {
  const prev = myPreds[fightId];
  const next = { ...(prev || {}), ...patch, member_id: getMemberId(), fight_id: fightId };
  myPreds[fightId] = next;
  replaceCard(fightId);
  saveChain[fightId] = (saveChain[fightId] || Promise.resolve()).then(async () => {
    try {
      // 名前の紐づけ（claim）は画面を開いた直後に裏で走る。終わる前に保存するとRLSで弾かれるので待つ
      if (window.CLAIM_PROMISE) await window.CLAIM_PROMISE;
      await DB.upsertPrediction({
        member_id: getMemberId(), fight_id: fightId,
        winner_id: next.winner_id, method: next.method || null,
        round: next.round || null, technique: next.technique || null,
      });
      toast(msg);
      await refreshMatrix();
    } catch (e) {
      if (myPreds[fightId] === next) { if (prev) myPreds[fightId] = prev; else delete myPreds[fightId]; replaceCard(fightId); }
      toast(window.saveErrorText ? saveErrorText(e) : (e.message || "保存できなかった"));
    }
  });
}

// 決まり手：判定 or 決定打(technique)を1つ。method は決定打から決まる。選び直したらラウンドは消す
function setKimarite(fightId, val) {
  const t = val && val !== "DEC" ? TECHNIQUES.find(x => x.id === val) : null;
  const patch = !val ? { method: null, technique: null } : val === "DEC" ? { method: "DEC", technique: null }
    : { method: t ? t.method : null, technique: val };
  savePred(fightId, { ...patch, round: null }, val ? "決まり手を保存 ✓" : "決まり手を外した");
}

function setRound(fightId, r) {
  const cur = Number(myPreds[fightId]?.round) === r;   // 同じラウンドを押し直すと外す
  savePred(fightId, { round: cur ? null : r }, cur ? "ラウンドを外した" : `${r}Rで保存 ✓`);
}

async function clearPred(fightId) {
  try {
    if (window.CLAIM_PROMISE) await window.CLAIM_PROMISE;
    await DB.deletePrediction(getMemberId(), fightId);
  } catch (e) { toast(window.saveErrorText ? saveErrorText(e) : (e.message || "取り消せなかった")); return; }
  delete myPreds[fightId];
  replaceCard(fightId);
  await refreshMatrix();
  toast("取り消した");
}

// オープンブック（締切なし）時、保存後にALL PICKS一覧と各カードの併記を即時更新
async function refreshMatrix() {
  if (PHASE === "before_open") return;
  allPreds = await DB.listPredictions({ fightIds: FIGHTS.map(f => f.id) });
  drawBishokuSummary();
  // 各カード下の「みんなの予想」も貼り直す（自分のピックが増減し、一致/割れも変わるため）
  // 中止試合のブロックは専用カード側で描画済みなので触らない。
  FIGHTS.forEach(f => {
    if (f.cancelled) return;
    const el = document.getElementById("op_" + f.id);
    if (el) el.outerHTML = othersBlock(f);
  });
}

function replaceCard(fightId) {
  const f = FIGHTS.find(x => x.id === fightId);
  const el = document.getElementById("fc_" + fightId);
  const tmp = document.createElement("div");
  tmp.innerHTML = (PHASE === "locked" || PHASE === "finished") ? resultCard(f)
    : PHASE === "before_open" ? previewCard(f) : predictCard(f);
  el.replaceWith(tmp.firstElementChild);
  drawProg();
}

// ---------- 答え合わせUI（締切後） ----------
function resultCard(f) {
  const f1 = FMAP[f.fighter1_id], f2 = FMAP[f.fighter2_id];
  const decided = f.winner_id && f.result_method && !f.no_score;
  let resultBox = `<div class="result-box waiting"><span class="rline">結果待ち</span></div>`;
  if (f.no_score) {
    const w = FMAP[f.winner_id];
    const res = (f.winner_id && f.result_method)
      ? `<div class="rline"><span class="win">🏆 ${fnm(w?.name)}</span>　${METHOD_LABEL[f.result_method] || ""}${f.result_method !== "DEC" && f.result_round ? ` ${f.result_round}R` : ""}${f.result_technique ? `／${TECH_LABEL[f.result_technique] || esc(f.result_technique)}` : ""}</div>`
      : "";
    resultBox = `<div class="result-box">${res}<span class="rline" style="color:#ffcf66">⚠️ ${esc(f.no_score_note || "体重超過")}（予想対象外・集計に含めない）</span></div>`;
  } else if (decided) {
    if (f.result_method === "DRAW" || f.result_method === "NC") {
      resultBox = `<div class="result-box"><span class="rline">${METHOD_LABEL[f.result_method]}</span>（集計対象外）</div>`;
    } else {
      const w = FMAP[f.winner_id];
      resultBox = `<div class="result-box">
        <div class="rline"><span class="win">🏆 ${fnm(w?.name)}</span>　${METHOD_LABEL[f.result_method] || ""}
          ${f.result_method !== "DEC" && f.result_round ? ` ${f.result_round}R` : ""}
          ${f.result_technique ? `／${TECH_LABEL[f.result_technique] || esc(f.result_technique)}` : ""}</div>
      </div>`;
    }
  }
  return `
    <div class="fight-card" id="fc_${f.id}">
      ${f.image_url ? `<div class="banner"><img src="${esc(f.image_url)}" alt="" loading="lazy"></div>` : ""}
      ${voteBar(f)}
      <div class="fight-label">${fightLabel(f)}</div>
      ${statsBlock(f)}
      ${profileLinks(f)}
      <div class="pick-zone">
      <div class="pz-head">${decided ? "結果と答え合わせ" : "勝敗予想（締切済み）"}</div>
      <div class="vs-row${decided && f.winner_id ? " has-sel" : ""}">
        ${cornerBox(f, 1, { sel: decided && f.winner_id === f.fighter1_id })}
        <span class="vs-mark">VS</span>
        ${cornerBox(f, 2, { sel: decided && f.winner_id === f.fighter2_id })}
      </div>
      ${supportRow(f)}
      ${resultBox}
      ${picksRows(f)}
      </div>
    </div>`;
}

// 1試合分の「全員の予想」行。結果が出ていれば○×・ピタリ・あらますを付ける。
// 答え合わせカード（締切後）とオープンブックの各カード下の両方で使う。
function picksRows(f) {
  const decided = f.winner_id && f.result_method && !f.no_score && !["DRAW", "NC"].includes(f.result_method);
  const preds = allPreds.filter(p => p.fight_id === f.id)
    .map(p => ({ p, m: MEMBERS.find(m => m.id === p.member_id), s: decided ? scoreFight(p, f) : null }))
    // 3人を最上部に固定 → その中/外で見せ場順（あらます>ピタリ>的中）
    .sort((a, b) => friendRank(a.p.member_id) - friendRank(b.p.member_id) || predRank(b.s) - predRank(a.s));
  // 応援📣も各行に出す（予想とは別軸）。応援だけして予想していない人も行を出す
  const sups = ALL_SUPPORTS.filter(s => s.fight_id === f.id);
  const supTag = (mid) => {
    const sup = sups.find(s => s.member_id === mid);
    return sup ? `<span class="psup ${sup.fighter_id === f.fighter1_id ? "r" : "b"}">📣 ${fnm(FMAP[sup.fighter_id]?.name)}</span>` : "";
  };
  const cheerOnly = sups.filter(s => !preds.some(x => x.p.member_id === s.member_id))
    .map(s => MEMBERS.find(m => m.id === s.member_id)).filter(Boolean)
    .sort((a, b) => friendRank(a.id) - friendRank(b.id));
  if (!preds.length && !cheerOnly.length) return `<div class="pred-row"><span class="pdetail">まだ予想なし</span></div>`;
  return preds.map(({ p, m, s }) => {
    const kim = p.method === "DEC" ? "判定" : (p.technique ? TECH_LABEL[p.technique] : null);
    const detail = [FMAP[p.winner_id]?.name, kim, (p.method !== "DEC" && p.round) ? `${p.round}R` : null].filter(Boolean).join("・");
    if (!s || !s.counted) return `<div class="pred-row"><span class="pwho">${avatarHTML(m, "pava")}${esc(m?.name)}</span><span class="pdetail">${esc(detail)}</span>${supTag(p.member_id)}</div>`;
    const tier = s.pitari ? `<span class="ptier pitari">ピタリ!</span>`
      : s.winnerHit ? `<span class="ptier">的中</span>` : "";
    return `<div class="pred-row ${s.winnerHit ? "hit" : "miss"}">
      <span class="hitmark">${s.winnerHit ? "○" : "×"}</span>
      <span class="pwho">${avatarHTML(m, "pava")}${esc(m?.name)}</span>
      <span class="pdetail">${esc(detail)}</span>
      ${supTag(p.member_id)}
      ${tier}
    </div>`;
  }).join("") + cheerOnly.map(m =>
    `<div class="pred-row"><span class="pwho">${avatarHTML(m, "pava")}${esc(m.name)}</span><span class="pdetail">予想なし</span>${supTag(m.id)}</div>`
  ).join("");
}

// その試合で「全員の勝者予想が揃っているか」を判定する。
//   unanimous＝予想した全員が同じ勝者／split＝割れている／none＝1人以下
function consensus(f) {
  const picks = allPreds.filter(p => p.fight_id === f.id);
  if (picks.length < 2) return { level: "none", n: picks.length };
  const winners = new Set(picks.map(p => p.winner_id));
  return winners.size === 1
    ? { level: "unanimous", winner: [...winners][0], n: picks.length }
    : { level: "split", n: picks.length };
}

// 得票率の横グラフ（オッズ可視化）。赤=RED側・青=BLUE側の勝者予想の割合。色は .vb（style.css）
function voteBar(f) {
  const picks = allPreds.filter(p => p.fight_id === f.id);
  const n = picks.length;
  if (!n) return "";
  const f1 = FMAP[f.fighter1_id], f2 = FMAP[f.fighter2_id];
  const n1 = picks.filter(p => p.winner_id === f.fighter1_id).length;
  const p1 = Math.round(n1 / n * 100), p2 = 100 - p1;
  return `
    <div class="votebar" style="margin:8px 0 4px">
      <div class="vb">${p1 ? `<i class="r" style="flex:${p1}">${p1 >= 12 ? p1 + "%" : ""}</i>` : ""}${p2 ? `<i class="b" style="flex:${p2}">${p2 >= 12 ? p2 + "%" : ""}</i>` : ""}</div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#888;margin-top:3px">
        <span>${fnm(f1?.name)} ${p1}%</span><span>${p2}% ${fnm(f2?.name)}</span>
      </div>
    </div>`;
}

// 各カードの下に出す「みんなの予想」ブロック。得票率グラフで割れ具合は一目なので文言バッジは出さない。
function othersBlock(f) {
  return `<div class="ob-picks" id="op_${f.id}">
    <div class="ob-head">みんなの予想<span class="ob-n">${allPreds.filter(p => p.fight_id === f.id).length}<small>人</small></span></div>

}

  // 中止・延期の試合は専用カード（大きくCANCELLED・予想は見れる）に差し替える。
  const card = (f) => f.cancelled ? cancelledCard(f)

         みんなの予想は各カードの下と美食会予想まとめで見える -->

// 美食会3人の予想まとめ（LINEで送る画像と同じ描き方＝js/bishoku_summary.js）を ALL PICKS の上に出す（Gaku指示11/7）
// 画像ファイルを貼らずにその場で組む＝予想や応援が入るたびに最新になる。幅1080pxの1枚を画面幅まで縮めて見せる。
// サイトのCSSと class 名がぶつからないよう Shadow DOM に入れる。丸の縁の強さに使うバナーの測定値は data/zones/<大会>.json（build_data.py が書く）
let BSUM_ZONES = null;
async function drawBishokuSummary() {
  const host = document.getElementById("bsum");
  if (!host || !window.BishokuSummary) return;
  if (BSUM_ZONES === null) {
    try { BSUM_ZONES = await (await fetch(`data/zones/${EV.id}.json`)).json(); } catch (e) { BSUM_ZONES = {}; }
  }
  const ids = window.BISHOKU;
  const members = ids.map(id => MEMBERS.find(m => m.id === id)).filter(Boolean);
  const now = new Date();
  const D = {
    members,
    preds: allPreds.filter(p => ids.includes(p.member_id)),
    supports: ALL_SUPPORTS.filter(s => ids.includes(s.member_id)),
    zones: BSUM_ZONES,
    built_at: `${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, "0")}`,
  };
  const fights = FIGHTS.filter(f => !f.cancelled).sort((a, b) => b.order_no - a.order_no);
  const root = host.shadowRoot || host.attachShadow({ mode: "open" });
  root.innerHTML = `<style>:host{display:block} .fit{transform-origin:0 0}${BishokuSummary.CSS}</style>
    <div class="fit"><div class="sheet">${BishokuSummary.render(D, { ev: EV, fights, fname: id => FMAP[id]?.name, img: u => u, bare: true })}</div></div>`;
  const fit = () => {
    const el = root.querySelector(".fit"), k = host.clientWidth / 1080;
    el.style.transform = `scale(${k})`;
    host.style.height = Math.ceil(el.firstElementChild.offsetHeight * k) + "px";
  };
  fit();
  root.querySelectorAll("img").forEach(im => im.complete || im.addEventListener("load", fit, { once: true }));
  // 幅が変わった時だけ合わせ直す（fit が高さを変える→また通知、の空回りで ResizeObserver loop のエラーが出ていた）
  if (!host._ro) { host._ro = new ResizeObserver(() => { if (host.clientWidth !== host._w) { host._w = host.clientWidth; fit(); } }); host._ro.observe(host); }
}

// 異名は切らない・途中で折らない（Gaku指摘11/7「異名切れてる」）。入りきらない時は字を小さくして1行に収める。
// 名前と同じ行で収まらなければ異名だけ次の行へ（.below）。9pxでも入らない長い異名だけ折り返す（.wrap）
// 左右の異名は高さと字の大きさを揃える（「異名の上下位置がズレてるとカッコ悪い」Gaku指摘11/7）
function fitNicks() {
  const px = (el) => parseFloat(getComputedStyle(el).fontSize);
  const shrink = (el, min) => {
    el.style.fontSize = "";
    let fs = px(el);
    while (el.scrollWidth > el.clientWidth + 1 && fs > min) { fs -= 0.5; el.style.fontSize = fs + "px"; }
    return el.scrollWidth <= el.clientWidth + 1;
  };
  const oneLine = (el) => el.offsetHeight < parseFloat(getComputedStyle(el).lineHeight) * 1.5;
  // lv＝年齢の置き場の下限（0＝名前の横／1＝異名の行／2＝異名の下）。左右を揃える時に使う
  const fitHead = (head, lv = 0) => {
    const name = head.querySelector(".st-name"), age = head.querySelector(".st-age"), nick = head.querySelector(".st-nick");
    head.classList.remove("below", "age-n", "age-b");
    if (nick) nick.classList.remove("wrap");
    if (getComputedStyle(head).display === "grid") {   // スマホ：1行目「名前 年齢」・2行目「異名」
      if (age && (lv || !oneLine(name))) {   // 年齢のせいで名前が折れる→年齢は異名の行へ。そこで異名が10pxを切るなら異名の下へ
        head.classList.add(lv === 2 ? "age-b" : "age-n");
        if (lv < 2 && nick && !shrink(nick, 10)) head.classList.replace("age-n", "age-b");
      }
      if (nick && !shrink(nick, 9)) nick.classList.add("wrap");
      return;
    }
    if (!nick || shrink(nick, 10)) return;   // 同じ行で縮めるのは1px（10px）まで
    head.classList.add("below");
    if (!shrink(nick, 9)) nick.classList.add("wrap");
  };
  document.querySelectorAll(".st-cols").forEach(cols => {
    const heads = [...cols.querySelectorAll(".st-head")];
    const names = heads.map(h => h.querySelector(".st-name"));
    const ages = heads.map(h => h.querySelector(".st-age")).filter(Boolean);
    names.forEach(n => { n.style.minHeight = ""; });
    ages.forEach(a => { a.style.marginTop = ""; });
    heads.forEach(h => fitHead(h));
    // 年齢も左右で同じ段に置く（Gaku指摘11/7「年齢」＝片側だけ年齢が3段目にあった）。
    // 片側が年齢を下の段へ逃がしたら、もう片側も同じ段へ。そこで片側がさらに下へ逃げたら、もう一度揃える
    const lvOf = (h) => h.classList.contains("age-b") ? 2 : h.classList.contains("age-n") ? 1 : 0;
    for (let i = 0, lv = 0; i < 2; i++) {
      const top = Math.max(...heads.map(lvOf));
      if (top === lv || heads.every(h => lvOf(h) === top)) break;
      lv = top; heads.forEach(h => fitHead(h, lv));
    }
    // 片側だけ異名が次の行へ落ちたら、もう片側も落とす
    if (heads.some(h => h.classList.contains("below")))
      heads.forEach(h => {
        const k = h.querySelector(".st-nick");
        if (k && !h.classList.contains("below")) { h.classList.add("below"); if (!shrink(k, 9)) k.classList.add("wrap"); }
      });
    // 字の大きさは左右で小さい方に合わせる
    const nicks = heads.map(h => h.querySelector(".st-nick")).filter(Boolean);
    const min = Math.min(...nicks.map(px));
    nicks.forEach(k => { if (px(k) > min) k.style.fontSize = min + "px"; });
    // 名前の段の高さを左右で揃える＝片側の名前が2行になっても異名は同じ高さから始まる
    const hmax = Math.max(...names.map(n => n.offsetHeight));
    names.forEach(n => { if (n.offsetHeight < hmax) n.style.minHeight = hmax + "px"; });
    // スマホで年齢が異名の下にある時は、片側だけ異名が無い・2行になると年齢の高さがずれる→高い方を下げて揃える
    if (ages.length === 2 && getComputedStyle(heads[0]).display === "grid") {
      const d = Math.round(ages[1].getBoundingClientRect().top - ages[0].getBoundingClientRect().top);
      if (d) ages[d > 0 ? 0 : 1].style.marginTop = Math.abs(d) + "px";
    }
  });
}
// 上の帯の目盛り（大会タブの予想済みと同じ型）と、上の「予想を入れる」。予想のたびに描き直す
const WIZ_FIGHTS = () => [...document.querySelectorAll(".fight-card")].map(el => FIGHTS.find(f => "fc_" + f.id === el.id))
  .filter(f => f && !f.cancelled && !f.event_only);
function drawProg() {
  const fs = FIGHTS.filter(f => !f.cancelled && !f.event_only), n = fs.filter(f => myPreds[f.id]?.winner_id).length;
  const el = document.getElementById("sticky-prog");
  if (el) el.innerHTML = progBlock(n, fs.length);
  const cta = document.getElementById("wiz-cta");
  if (cta) cta.outerHTML = wizCta();
}

// ---------- 予想の画面（Gaku 11/7「ボタンで押して階層を作る」「脳死で質問に答えれば勝敗が正しく思い通りに入力される」） ----------
// 大会ページは見る所。予想は上の「予想を入れる」（またはカードの札）から入る別の画面で、1試合ずつ「どっちが勝つ？」に答えるだけ。
// 顔の札が画面いっぱい（「MAX時には画面いっぱい」）。押すと金で光って次の試合へ。戻る・飛ばすがあり、全部埋めさせはしない。
// 押した時点では保存しない。最後に選んだ内容を一覧にして「これでいい？」と聞き、「これで決定」でまとめて保存する（「決定前は…確認を挟む」）
function wizCta() {
  const fs = FIGHTS.filter(f => !f.cancelled && !f.event_only);
  if (!fs.length) return "";
  const all = fs.every(f => myPreds[f.id]?.winner_id), m = FIGHTS.find(f => !f.cancelled && f.segment !== "opening") || fs[0];
  const face = (id) => FMAP[id]?.highlight_url ? `<i style="background-image:url('${esc(FMAP[id].highlight_url)}')"></i>` : "<i></i>";
  return `<button type="button" class="wiz-cta${all ? " done" : ""}" id="wiz-cta" onclick="openWiz()">
      ${face(m.fighter1_id)}<span class="wc-t">${all ? "予想を見直す" : "予想を入れる"}<small>${all ? "CHECK YOUR PICKS" : "WHO WINS?"}</small></span>${face(m.fighter2_id)}
    </button>`;
}
const WIZ = { list: [], i: 0, pend: null };   // pend＝この試合で押した中身（勝者・決まり手・ラウンド）。「決定」で保存するまでは仮（Gaku 11/7「これでいい？は各試合の予想登録の話」）
const wizSaved = (f) => myPreds[f.id]?.winner_id || null;
const WIZ_KEYS = ["winner_id", "method", "technique", "round"];
const wizBase = (f) => Object.fromEntries(WIZ_KEYS.map(k => [k, myPreds[f.id]?.[k] || null]));
const wizCur = (f) => WIZ.pend || wizBase(f);
// 保存済みと同じ中身に戻ったら仮を消す（「これでいい？」を出さない）
function wizSet(p) {
  const f = WIZ.list[WIZ.i], b = wizBase(f);
  WIZ.pend = WIZ_KEYS.every(k => (p[k] || null) == (b[k] || null)) ? null : p;
}
function openWiz(fightId) {
  WIZ.list = WIZ_FIGHTS();
  if (!WIZ.list.length) return;
  WIZ.i = Math.max(0, WIZ.list.findIndex(f => fightId ? f.id === fightId : !wizSaved(f)));
  WIZ.pend = null;
  document.getElementById("wiz").hidden = false;
  document.body.classList.add("wiz-open");
  history.pushState({ wiz: 1 }, "");
  drawWiz();
}
function hideWiz() {
  document.getElementById("wiz").hidden = true;
  document.body.classList.remove("wiz-open");
}
function closeWiz() { if (history.state?.wiz) history.back(); else hideWiz(); }
addEventListener("popstate", () => { if (!document.getElementById("wiz").hidden) hideWiz(); });
function wizGo(k) { WIZ.i = k; WIZ.pend = null; drawWiz(); }
function drawWiz(pop) {
  const w = document.getElementById("wiz"), L = WIZ.list, f = L[WIZ.i];
  const saved = wizSaved(f), cur = wizCur(f), wid = cur.winner_id, ask = !!WIZ.pend, last = WIZ.i === L.length - 1;
  const bar = `<span class="ep-bar wiz-bar">${L.map((x, k) =>
    `<i class="${wizSaved(x) ? "on" : ""}${k === WIZ.i ? " cur" : ""}" onclick="wizGo(${k})"></i>`).join("")}</span>`;
  const c = (side) => {
    const fid = side === 1 ? f.fighter1_id : f.fighter2_id, sel = wid === fid;
    return cornerBox(f, side, { sel, tag: "button", attrs: ` onclick="wizPick(${side})"`, cls: sel && pop ? "pop" : "" });
  };
  w.innerHTML = `<div class="wiz-top"><button type="button" class="wiz-x" onclick="closeWiz()" aria-label="閉じる">×</button>${bar}</div>
    <div class="wiz-q"><div class="fight-label">${fightLabel(f)}</div><h2 class="wiz-h">${ask ? "これでいい？" : "どっちが勝つ？"}</h2></div>
    <div class="vs-row wiz-stage${wid ? " has-sel" : ""}">${c(1)}<span class="vs-mark">VS</span>${c(2)}</div>
    ${wid ? wizKim(f, cur) : ""}
    <div class="wiz-nav${ask ? " ask" : ""}">${ask
      ? `<button type="button" class="wiz-arw" onclick="wizStep(-1)" ${WIZ.i === 0 ? "disabled" : ""} aria-label="前の試合">‹</button>
         <button type="button" class="wiz-ok" id="wiz-ok" onclick="wizCommit()">決定</button>
         <button type="button" class="wiz-arw" onclick="wizStep(1)" aria-label="${last ? "閉じる" : "次の試合"}">›</button>`
      : `<button type="button" onclick="wizStep(-1)" ${WIZ.i === 0 ? "disabled" : ""}>‹ 戻る</button>
         <button type="button" onclick="wizStep(1)">${last ? "閉じる" : saved ? "次へ ›" : "飛ばす ›"}</button>`}
    </div>`;
}
// 決まり手は入れたい人だけ（Gaku 11/7「入れる人入れるし入れない人はスルー」）。押さなければ勝敗だけで決定できる。
// 判定ならそれで終わり。KO/一本は決定打とラウンドまで当てて🎯ピタリ（scoreFight と同じ条件）
function wizKim(f, cur) {
  const m = cur.method, chip = (on, js, t) => `<button type="button" class="chip${on ? " sel" : ""}" onclick="${js}">${t}</button>`;
  return `<div class="wiz-kim">
    <div class="wk-row">${METHODS.map(x => chip(m === x.id, `wizMethod('${x.id}')`, x.label)).join("")}</div>
    ${m && m !== "DEC" ? `<div class="wk-row">
      <select class="tech-select" onchange="wizTech(this.value)" aria-label="決定打">
        <option value="">決定打 —</option>
        ${techsFor(m).map(t => `<option value="${t.id}" ${cur.technique === t.id ? "selected" : ""}>${t.label}</option>`).join("")}
      </select>
      ${Array.from({ length: f.rounds || 3 }, (_, i) => i + 1).map(r => chip(Number(cur.round) === r, `wizRound(${r})`, `${r}R`)).join("")}
    </div>` : ""}
  </div>`;
}
// 同じものを押し直すと外す
function wizMethod(m) {
  const p = { ...wizCur(WIZ.list[WIZ.i]) };
  if (p.method === m) Object.assign(p, { method: null, technique: null, round: null });
  else Object.assign(p, { method: m, technique: null, round: m === "DEC" ? null : p.round });
  wizSet(p); drawWiz();
}
function wizTech(v) { wizSet({ ...wizCur(WIZ.list[WIZ.i]), technique: v || null }); drawWiz(); }
function wizRound(r) {
  const p = wizCur(WIZ.list[WIZ.i]);
  wizSet({ ...p, round: Number(p.round) === r ? null : r }); drawWiz();
}
// 決定せずに離れた試合は保存しない（押しただけでは入らない）
function wizStep(d) {
  const k = WIZ.i + d;
  if (k >= WIZ.list.length) return closeWiz();
  wizGo(Math.max(0, k));
}
// 押したら金で囲んで「これでいい？」。もう一方を押せば選び直し。勝者を変えても決まり手・ラウンドはそのまま
function wizPick(side) {
  const f = WIZ.list[WIZ.i], fid = side === 1 ? f.fighter1_id : f.fighter2_id;
  wizSet({ ...wizCur(f), winner_id: fid });
  drawWiz(true);
}
// 「決定」：この1試合を保存して、まだ予想していない次の試合へ。全部入っていれば閉じる。
async function wizCommit() {
  const f = WIZ.list[WIZ.i], p = WIZ.pend, btn = document.getElementById("wiz-ok");
  if (!p?.winner_id) return;
  btn.disabled = true; btn.textContent = "保存中…";
  try {
    if (window.CLAIM_PROMISE) await window.CLAIM_PROMISE;   // 名前の紐づけが終わる前に保存するとRLSで弾かれる
    const next = { ...(myPreds[f.id] || {}), ...p, member_id: getMemberId(), fight_id: f.id };
    await DB.upsertPrediction({ member_id: next.member_id, fight_id: f.id, winner_id: next.winner_id,
      method: next.method || null, round: next.round || null, technique: next.technique || null });
    myPreds[f.id] = next;
    WIZ.pend = null;
    replaceCard(f.id);
    refreshMatrix().catch(() => {});
    btn.textContent = "✓";
    const L = WIZ.list, rest = [...L.slice(WIZ.i + 1), ...L.slice(0, WIZ.i)].find(x => !wizSaved(x));
    setTimeout(() => {
      if (document.getElementById("wiz").hidden) return;
      if (rest) wizGo(L.indexOf(rest));
      else { toast(`全${L.length}試合 予想済み ✓`); closeWiz(); }
    }, 420);
  } catch (e) {
    toast(window.saveErrorText ? saveErrorText(e) : (e.message || "保存できなかった"));
    btn.disabled = false; btn.textContent = "決定";
  }
}

new ResizeObserver(([e]) => document.documentElement.style.setProperty("--hdr-h", e.target.offsetHeight + "px"))
  .observe(document.getElementById("app-header"));
// カードは予想のたびに差し替わる（replaceCard）ので、描き直しを見張って合わせ直す
let NICK_T = 0;
const refitNicks = () => { clearTimeout(NICK_T); NICK_T = setTimeout(fitNicks, 30); };
new MutationObserver(refitNicks).observe(document.getElementById("main"), { childList: true, subtree: true });
addEventListener("resize", refitNicks);
document.fonts?.ready.then(refitNicks);

load();
</script>
</body>
</html>
