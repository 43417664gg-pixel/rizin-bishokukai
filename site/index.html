<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>RIZIN美食会予想</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260812231358">
</head>
<body>
<div id="app-header"></div>
<div class="wrap" id="main"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=20260812231358"></script>
<script src="js/techniques.js?v=20260812231358"></script>
<script src="js/demo-data.js?v=20260812231358"></script>
<script src="js/api.js?v=20260812231358"></script>
<script src="js/app.js?v=20260812231358"></script>
<script>
async function renderPlayerSelect() {
  const members = await DB.listMembers();
  // 美食会コア（3人）だけ既存タイルで復帰可。インフルエンサーは予想の出典であって"なりすまし入口"にしない。
  const FRIEND_IDS = ["m_hame", "m_nuki", "m_maruyama"];
  const friends = members.filter(m => FRIEND_IDS.includes(m.id));
  document.getElementById("main").innerHTML = `
    <div class="ps-hero">
      <div class="en-label">JOIN FREE</div>
      <h1 class="page-title">予想を始めよう</h1>
      <p class="page-sub">名前を決めるだけ。登録不要で今すぐ予想＆応援できる。</p>
    </div>
    <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:2px auto 16px;max-width:460px">
      <span style="font-size:12px;font-weight:900;color:#c9a84a;background:#1a1710;border:1px solid #3a3320;border-radius:999px;padding:5px 12px">🎁 完全無料</span>
      <span style="font-size:12px;font-weight:900;color:#c9a84a;background:#1a1710;border:1px solid #3a3320;border-radius:999px;padding:5px 12px">🚫 広告なし</span>
      <span style="font-size:12px;font-weight:900;color:#c9a84a;background:#1a1710;border:1px solid #3a3320;border-radius:999px;padding:5px 12px">🪙 賭けなし</span>
    </div>
    <div class="guest-box" style="background:#131318;border:1px solid #2a2a33;border-radius:12px;padding:16px;margin:0 auto;max-width:460px">
      <input id="gname" placeholder="ニックネーム（例：格闘技太郎）" maxlength="20"
        style="width:100%;box-sizing:border-box;padding:12px;font-size:16px;border-radius:8px;border:1px solid #3a3a44;background:#0d0d10;color:#fff"
        onkeydown="if(event.key==='Enter')startGuest()">
      <button onclick="startGuest()"
        style="width:100%;margin-top:10px;padding:13px;font-size:15px;font-weight:900;border:none;border-radius:8px;background:#e60012;color:#fff;cursor:pointer">この名前で始める →</button>
      <p style="font-size:11px;color:#8a8a92;margin:8px 0 0">※記録はこの端末に保存。別端末で引き継ぎたい人は後からアカウント連携（近日）。</p>
    </div>
    ${friends.length ? `
    <details style="max-width:460px;margin:16px auto 0">
      <summary style="cursor:pointer;color:#9a9aa2;font-size:13px;padding:6px">美食会メンバー・前に参加した人はこちら</summary>
      <div class="player-grid" style="margin-top:10px">
        ${friends.map((m, i) => `
          <button class="player-tile" style="--c:${esc(m.color)};--d:${i * 70}ms" data-initial="${esc(m.name.slice(0, 1))}" onclick="choose('${m.id}')">
            <span class="entry-no">MEMBER</span>
            <span class="pname">${esc(m.name)}</span>
          </button>`).join("")}
      </div>
    </details>` : ""}
    <div class="rules-box">
      <b>ルールは二段：</b>勝者を当てて<b class="gold">的中</b>、
      決まり手＋ラウンドまで揃えば<b class="gold">ピタリ</b>。
      勝者を外したらパー。予想しない試合はノーカウント。
    </div>`;
}

function choose(id) { setMemberId(id); renderHome(); }

// ゲスト登録：名前だけで自分専用のメンバーを作って即プレイ（ゼロ障壁）
async function startGuest() {
  const name = (document.getElementById("gname").value || "").trim();
  if (!name) { alert("ニックネームを入れてね"); return; }
  const pal = ["#e17055", "#00b894", "#0984e3", "#e84393", "#00cec9", "#6c5ce7", "#fdcb6e", "#d63031"];
  const id = "m_g_" + Math.random().toString(36).slice(2, 9);
  try {
    await DB.upsertMember({ id, name, color: pal[Math.floor(Math.random() * pal.length)] });
    setMemberId(id);
    renderHome();
  } catch (e) { alert("登録できませんでした（メンバー作成のRLS未設定かも）：" + (e.message || e)); }
}

async function renderHome() {
  await renderHeader("home");
  const all = await DB.listEvents();
  const FMAP = fighterMap(await DB.listFighters());
  const isFin = (e) => e.status === "finished";
  // 「結果ダイジェスト」は直近の1大会だけ上部に残す（Gaku方針・2026-08-11）。残りの終了大会は下の「これまでの大会」へ。
  const finishedDesc = all.filter(isFin).sort((a, b) => (b.event_date || "").localeCompare(a.event_date || ""));
  const recentFinished = finishedDesc.slice(0, 1);
  const recentIds = new Set(recentFinished.map(e => e.id));
  const live = all.filter(e => !isFin(e)).sort((a, b) => (a.event_date || "").localeCompare(b.event_date || ""));
  const pastFinished = finishedDesc.filter(e => !recentIds.has(e.id));

  // 半分サイズの結果ダイジェスト（メイン結果を匂わせて「結果＆ランキングを見る」へ誘導）
  const compactCard = async (ev) => {
    const fights = await DB.listFights(ev.id);
    const done = fights.filter(f => f.winner_id && f.result_method && !f.cancelled)
      .sort((a, b) => b.order_no - a.order_no);
    const main = done[0];
    const mainTxt = main
      ? `🏆 ${esc(FMAP[main.winner_id]?.name || "")}　${METHOD_LABEL[main.result_method] || ""}`
      : "結果発表";
    return `
      <a class="event-card compact result" href="event.html?id=${ev.id}">
        ${ev.poster_url ? `<div class="eposter mini" style="background-image:url('${esc(ev.poster_url)}')"></div>` : ""}
        <div class="ebody">
          <div class="ename small">${esc(ev.name)}<span class="result-flag">結果発表</span></div>
          <div class="compact-main">${mainTxt}</div>
          <div class="compact-hook">全結果＆ランキングを見る ›</div>
        </div>
      </a>`;
  };

  // 通常サイズ（受付中・COMING SOON・過去）
  const fullCard = async (ev) => {
    const fights = await DB.listFights(ev.id);
    const myPreds = await DB.listPredictions({ fightIds: fights.map(f => f.id), memberId: getMemberId() });
    if (!fights.length) {
      return `
        <div class="event-card soon">
          <div class="ebody">
            <div class="soon-label">COMING SOON</div>
            <div class="ename">${esc(ev.name)}</div>
            <div class="emeta"><span>${fmtDate(ev.event_date)}</span><span class="tag before_open">対戦カード発表待ち</span></div>
          </div>
        </div>`;
    }
    const phase = eventPhase(ev), days = daysToEvent(ev), openBook = isOpenBook(ev);
    const tag = openBook ? `<span class="tag open">予想受付中・締切なし</span>` : `<span class="tag ${phase}">${PHASE_LABEL[phase]}</span>`;
    const countdown = (phase === "open" && !openBook) ? `
      <div class="countdown-bar">
        <div class="cd-left"><span class="cd-label">予想締切まで</span><span class="cd-timer" data-target="${ev.lock_at}">--:--:--</span></div>
        ${days !== null && days >= 0 ? `<div class="cd-days"><b>${days === 0 ? "本日" : "あと" + days + "日"}</b><span>大会${days === 0 ? "開催" : "まで"}</span></div>` : ""}
      </div>` : "";
    return `
      <a class="event-card" href="event.html?id=${ev.id}">
        ${ev.poster_url ? `<div class="eposter" style="background-image:url('${esc(ev.poster_url)}')"><img src="${esc(ev.poster_url)}" alt=""></div>` : ""}
        <div class="ebody">
          <div class="ename">${esc(ev.name)}</div>
          <div class="emeta"><span>${fmtDate(ev.event_date)}</span>${tag}<span>予想済み ${myPreds.length}/${fights.length}</span></div>
        </div>
        ${countdown}
      </a>`;
  };

  const recentHtml = (await Promise.all(recentFinished.map(compactCard))).join("");
  const liveCards = await Promise.all(live.map(fullCard));
  // 先頭の未来大会＝次大会。NEXTで匂わせる。
  const liveHtml = liveCards.map((html, i) =>
    i === 0 ? `<div class="next-flag">🔥 NEXT EVENT ・ 次はこれ</div>${html}` : html).join("");
  const pastHtml = (await Promise.all(pastFinished.map(fullCard))).join("");

  document.getElementById("main").innerHTML = `
    <div class="en-label">EVENTS</div>
    <h1 class="page-title">大会</h1>
    <p class="page-sub">カードをタップして予想。この大会は締切なし・いつでも編集OK。</p>
    ${recentHtml ? `<div class="section-label">直近の結果</div>${recentHtml}` : ""}
    ${liveHtml}
    ${pastHtml ? `<div class="section-label">これまでの大会</div>${pastHtml}` : ""}`;
  document.querySelectorAll(".cd-timer").forEach(el =>
    startCountdown(el, el.dataset.target, () => location.reload()));
}

(async () => {
  await renderHeader("home");
  if (getMemberId()) renderHome(); else renderPlayerSelect();
})();
</script>
</body>
</html>
