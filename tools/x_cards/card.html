<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- X投稿用の画像を描く。render.sh が headless Chrome で撮る。
     ?f=<fight_id> … 公式VSバナー＋インフルエンサーのロゴ（予想した選手の側）＋「みんなの予想は？」（1200x855）
     ?mode=rank    … 遡り採点の的中率ランキング（1200x675）
     公式VSバナーの使用はGaku判断（2026-11-01「写真使っちゃっていいよ」）。 -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --red:#e60012; --gold:#c9a84a; --ink:#f4f4f6; --mute:#9a9aa2; --bg:#0b0b0e; --line:#26262e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--bg); color:var(--ink); font-family:"Noto Sans JP",sans-serif; overflow:hidden; }

  /* ── 1試合カード ── */
  .fc { position:relative; width:1200px; height:855px; }
  .fc .banner { position:absolute; left:0; top:0; width:1200px; height:675px; object-fit:cover; }
  .fc .strip { position:absolute; left:0; top:675px; width:1200px; height:180px; background:var(--bg); border-top:4px solid var(--red);
               display:grid; grid-template-columns:400px 400px 400px; }
  .fc .mid { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .fc .q { font-size:46px; font-weight:900; letter-spacing:.02em; }
  .fc .brand { margin-top:8px; font-size:20px; font-weight:900; }
  .fc .brand span { color:var(--gold); }
  .fc .brand small { font-size:16px; color:var(--mute); font-weight:700; margin-left:8px; }
  .fc .url { margin-top:2px; font-size:15px; color:var(--mute); font-weight:700; }
  /* ロゴ：バナーと帯の境目にまたがって「その選手の側に貼る」 */
  .fc .side { position:relative; display:flex; justify-content:center; gap:14px; }
  .fc .pk { width:118px; margin-top:-44px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .fc .pk img { width:84px; height:84px; border-radius:50%; object-fit:cover; border:3px solid var(--gold); background:#fff;
                box-shadow:0 4px 14px rgba(0,0,0,.6); }
  .fc .pk .nm { margin-top:6px; font-size:15px; font-weight:900; line-height:1.2; white-space:nowrap; }
  .fc .pk .mt { font-size:13px; font-weight:700; color:var(--gold); line-height:1.3; }
  .fc .pk .rt { font-size:12px; font-weight:700; color:var(--mute); }

  /* ── ランキング ── */
  .rc { position:relative; width:1200px; height:675px; padding:36px 56px 0; display:flex; flex-direction:column;
        background:radial-gradient(900px 500px at 50% 45%, #1a1014 0%, var(--bg) 70%); border-top:8px solid var(--red); }
  .rc .top { display:flex; justify-content:space-between; align-items:center; }
  .rc .brand { font-size:34px; font-weight:900; }
  .rc .brand span { color:var(--gold); }
  .rc .tag { font-family:Anton; font-size:28px; letter-spacing:.08em; color:var(--mute); }
  .rc .ttl { margin-top:14px; font-size:38px; font-weight:900; }
  .rc .ttl small { display:block; font-size:18px; font-weight:700; color:var(--mute); margin-top:2px; }
  .rc .rk { flex:1; margin-top:12px; display:grid; grid-template-columns:1fr 1fr; gap:6px 36px; align-content:start; }
  .rc .row { display:grid; grid-template-columns:38px 54px 1fr auto; align-items:center; gap:12px; border-bottom:1px solid var(--line); padding:7px 0; }
  .rc .no { font-family:Anton; font-size:30px; color:var(--gold); }
  .rc .row img { width:54px; height:54px; border-radius:50%; object-fit:cover; border:2px solid var(--gold); background:#fff; }
  .rc .nm { font-size:24px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rc .pc { font-family:Anton; font-size:34px; }
  .rc .pc small { font-family:"Noto Sans JP"; font-size:15px; color:var(--mute); margin-left:8px; font-weight:700; }
  .rc .cta { margin:0 -56px; background:var(--red); padding:16px 56px; display:flex; justify-content:space-between; align-items:center; }
  .rc .cta .q { font-size:36px; font-weight:900; }
  .rc .cta .s { font-size:19px; font-weight:700; text-align:right; line-height:1.4; }
</style>
</head>
<body>
<div id="card"></div>
<script src="../../site/js/demo-data.js"></script>
<script src="data.js"></script>
<script>
const S = window.DEMO_SEED, X = window.XDATA;
const q = new URLSearchParams(location.search);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const URL_SHORT = "43417664gg-pixel.github.io/rizin-bishokukai";
const METHOD = { KO:"KO", SUB:"一本", DEC:"判定" };
const logo = id => `logos/${id}.jpg`;
const card = document.getElementById("card");

if (q.get("mode") === "rank") {
  const rows = X.rank.map((r, i) => `<div class="row"><span class="no">${i + 1}</span><img src="${logo(r.id)}">
    <span class="nm">${esc(r.name)}</span><span class="pc">${r.rate.toFixed(1)}%<small>${r.n}試合</small></span></div>`).join("");
  card.innerHTML = `<div class="rc">
    <div class="top"><div class="brand">予想<span>番付</span></div><div class="tag">RANKING</div></div>
    <div class="ttl">格闘技YouTuber・選手の予想的中率<small>公開されている過去の予想動画を遡って集計（2020年〜2026年10月・本人の発言のみ）</small></div>
    <div class="rk">${rows}</div>
    <div class="cta"><div class="q">いちばん当てるのは誰だ。</div><div class="s">予想番付｜無料・賭けなし<br>${URL_SHORT}</div></div></div>`;
} else {
  const ft = S.fights.find(x => x.id === q.get("f"));
  const ps = X.picks[ft.id] || [];
  const col = id => ps.filter(p => p.pick === id).map(p => `<div class="pk"><img src="${logo(p.id)}">
      <div class="nm">${esc(p.who)}</div>
      <div class="mt">${p.method ? METHOD[p.method] + "で勝つ" : "勝つ"}と予想</div>
      ${p.rate != null ? `<div class="rt">通算的中 ${p.rate.toFixed(1)}%</div>` : ""}</div>`).join("");
  card.innerHTML = `<div class="fc">
    <img class="banner" src="../../site/${esc(ft.image_url)}">
    <div class="strip">
      <div class="side">${col(ft.fighter1_id)}</div>
      <div class="mid"><div class="q">みんなの予想は？</div>
        <div class="brand">予想<span>番付</span><small>無料・賭けなし</small></div>
        <div class="url">${URL_SHORT}</div></div>
      <div class="side">${col(ft.fighter2_id)}</div>
    </div></div>`;
}
document.title = "ready";
</script>
</body>
</html>
